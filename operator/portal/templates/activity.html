<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>PEN-AGENT &middot; Activity</title>
<style>
:root{
  --bg:#090b0f;--bg2:#0e1217;--bg3:#161b22;
  --surface:#12161c;--surface-2:#161c24;
  --border:#1e242e;--border-2:#2a323e;
  --fg:#eef2f6;--fg-2:#aab4c0;--fg-3:#6a7482;
  --accent:#4f8cff;--accent-2:#7aa7ff;--accent-soft:rgba(79,140,255,.12);
  --green:#3fb950;--green-soft:rgba(63,185,80,.1);
  --red:#f0564d;--red-soft:rgba(240,86,77,.08);
  --amber:#d6a533;--amber-soft:rgba(214,165,51,.1);--purple:#a371f7;--slate:#8b97a6;--blue:#5b93d6;
  --c-recon:#5b93d6;--c-vuln:#f0564d;--c-credential:#8b97a6;--c-access:#3fb950;
  --c-pivot:#d6a533;--c-blocked:#e06b4d;--c-other:#6a7482;
  --t-input:#4f8cff;--t-cw:#d6a533;--t-cr:#5b6675;--t-out:#3fb950;
  --sh-sm:0 1px 2px rgba(0,0,0,.4);
  --sh-md:0 2px 4px rgba(0,0,0,.3),0 6px 16px rgba(0,0,0,.25);
  --ui:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono","Cascadia Code",Menlo,Consolas,monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:radial-gradient(1000px 500px at 85% -10%,rgba(79,140,255,.05),transparent 60%),var(--bg);
  color:var(--fg);font-family:var(--ui);font-size:13px;line-height:1.5;-webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;min-height:100vh;padding:28px 32px 64px}
.wrap{max-width:1180px;margin:0 auto}
.conn{position:fixed;top:14px;right:18px;font-size:10.5px;font-weight:600;letter-spacing:.04em;
  padding:4px 11px;border-radius:999px;border:1px solid var(--border-2);color:var(--fg-3);
  display:inline-flex;align-items:center;gap:6px;background:var(--bg3);z-index:20}
.conn::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--fg-3)}
.conn.ok{color:var(--green);border-color:rgba(63,185,80,.35);background:var(--green-soft)}
.conn.ok::before{background:var(--green);box-shadow:0 0 6px var(--green);animation:pulse 2.4s infinite}
.conn.bad{color:var(--red);border-color:rgba(240,86,77,.4);background:var(--red-soft)}
.conn.bad::before{background:var(--red)}
@keyframes pulse{0%{opacity:1}50%{opacity:.4}100%{opacity:1}}

/* ── Team roster (top) ─────────────────────────────────────────────────── */
.hero{position:relative;padding:22px 26px;border-radius:18px;overflow:hidden;
  background:linear-gradient(140deg,rgba(79,140,255,.07),rgba(79,140,255,0) 48%),
             linear-gradient(180deg,var(--surface-2),var(--surface));
  border:1px solid var(--border);box-shadow:var(--sh-md)}
.hero::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(122,167,255,.5),transparent)}
.hero-top{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;flex-wrap:wrap}
.eyebrow{color:var(--fg-3);font-size:10px;font-weight:600;letter-spacing:.16em;text-transform:uppercase}
.hero h1{font-size:22px;font-weight:650;letter-spacing:-.02em;color:var(--fg);margin-top:7px}
.hero h1 .dim{color:var(--fg-3);font-weight:600}
.statline{display:flex;gap:9px;flex-wrap:wrap;margin-top:12px}
.rs{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:999px;
  background:var(--bg3);border:1px solid var(--border);font-size:11.5px;font-weight:600;color:var(--fg-2)}
.rs .dot{width:8px;height:8px;border-radius:50%} .rs .n{font-family:var(--mono);font-weight:700}
.rs.active .dot{background:var(--green);box-shadow:0 0 6px var(--green)} .rs.active .n{color:var(--green)}
.rs.idle .dot{background:var(--fg-3)} .rs.idle .n{color:var(--fg-2)}
.rs.flagged .dot{background:var(--red);box-shadow:0 0 6px var(--red)} .rs.flagged .n{color:var(--red)}
.hero-right{display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.spend{text-align:right}
.spend .v{font-family:var(--mono);font-size:19px;font-weight:700;color:var(--fg-2)}
.spend .k{font-size:9px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--fg-3)}
.modeswitch{display:flex;gap:2px;background:var(--bg3);border:1px solid var(--border);border-radius:9px;padding:3px}
.modeswitch .ms{appearance:none;background:transparent;border:none;color:var(--fg-3);
  font-family:var(--ui);font-size:10.5px;font-weight:600;padding:5px 11px;border-radius:6px;cursor:pointer;
  transition:color .12s,background .12s;white-space:nowrap}
.modeswitch .ms:hover{color:var(--fg)}
.modeswitch .ms.active{color:var(--fg);background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--border-2)}
.teamfilter{appearance:none;cursor:pointer;font-family:var(--ui);font-size:10.5px;font-weight:600;
  padding:6px 12px;border-radius:999px;border:1px solid var(--border);background:var(--bg3);color:var(--fg-3);
  white-space:nowrap;transition:color .12s,background .12s,border-color .12s;display:inline-flex;align-items:center;gap:6px}
.teamfilter:hover{color:var(--fg);border-color:var(--border-2)}
.teamfilter .d{width:7px;height:7px;border-radius:50%;background:var(--fg-3)}
.teamfilter.on{background:var(--green-soft);border-color:rgba(63,185,80,.4);color:var(--green)}
.teamfilter.on .d{background:var(--green);box-shadow:0 0 6px var(--green)}
.alert{display:flex;align-items:center;gap:11px;margin-top:16px;padding:12px 15px;border-radius:12px;
  background:var(--red-soft);border:1px solid rgba(240,86,77,.35);color:#f6a79f;font-size:12.5px;line-height:1.45}
.alert .ic{width:22px;height:22px;flex-shrink:0;color:var(--red)}
.alert b{color:#ffd9d4;font-weight:700}

.sec-label{display:flex;align-items:center;gap:10px;margin:28px 2px 14px;
  font-size:10.5px;font-weight:650;letter-spacing:.14em;text-transform:uppercase;color:var(--fg-3)}
.sec-label .n{font-family:var(--mono);color:var(--fg-3);font-weight:600}
.sec-label::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,var(--border),transparent)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(355px,1fr));gap:13px}
.card{background:linear-gradient(180deg,var(--surface-2),var(--surface));border:1px solid var(--border);
  border-radius:14px;padding:15px 16px;box-shadow:var(--sh-sm);transition:border-color .12s;
  display:flex;flex-direction:column;position:relative;overflow:hidden}
.card:hover{border-color:var(--border-2)}
.card::before{content:'';position:absolute;top:0;left:0;bottom:0;width:3px;background:var(--border-2)}
.card.active::before{background:var(--green);box-shadow:0 0 10px rgba(63,185,80,.4)}
.card.flagged::before{background:var(--red);box-shadow:0 0 10px rgba(240,86,77,.5)}
.card.idle::before{background:var(--fg-3)}
.card.flagged{border-color:rgba(240,86,77,.35)}
.chead{display:flex;align-items:center;gap:10px}
.sdot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.card.active .sdot{background:var(--green);box-shadow:0 0 7px var(--green)}
.card.idle .sdot{background:var(--fg-3)}
.card.flagged .sdot{background:var(--red);box-shadow:0 0 7px var(--red)}
.cname{font-size:14.5px;font-weight:700;color:var(--fg);letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sbadge{font-size:9px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;padding:3px 8px;border-radius:5px;flex-shrink:0}
.sbadge.active{color:var(--green);background:var(--green-soft);border:1px solid rgba(63,185,80,.35)}
.sbadge.idle{color:var(--fg-3);background:var(--bg3);border:1px solid var(--border)}
.sbadge.flagged{color:var(--red);background:var(--red-soft);border:1px solid rgba(240,86,77,.4)}
.model{margin-left:auto;font-family:var(--mono);font-size:9.5px;font-weight:600;color:var(--accent-2);
  background:var(--accent-soft);border:1px solid rgba(79,140,255,.25);border-radius:5px;padding:2px 7px;flex-shrink:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:150px}
.task{margin-top:10px;font-size:12.5px;color:var(--fg);line-height:1.5;display:flex;gap:8px;align-items:flex-start}
.task .lab{font-size:8.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-3);
  background:var(--bg3);border:1px solid var(--border);border-radius:4px;padding:2px 6px;flex-shrink:0;margin-top:1px}
.task .txt{flex:1;min-width:0}
.task .txt .when{color:var(--fg-3);font-family:var(--mono);font-size:10.5px;margin-left:4px}
.task.none .txt{color:var(--fg-3);font-style:italic}
.flags{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}
.flag{display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:600;font-family:var(--mono);
  border-radius:5px;padding:3px 8px}
.flag.blk{color:var(--amber);background:var(--amber-soft);border:1px solid rgba(214,165,51,.35)}
.flag.aup{color:var(--red);background:var(--red-soft);border:1px solid rgba(240,86,77,.4)}
.spend-sep{border-top:1px solid var(--border);margin-top:12px}
.spendrow{margin-top:auto;padding-top:12px;display:flex;align-items:center;gap:11px}
.minibar{flex:1;height:7px;border-radius:5px;overflow:hidden;display:flex;background:var(--bg3);border:1px solid var(--border);min-width:60px}
.minibar span{display:block;height:100%}
.seg-input{background:var(--t-input)} .seg-cw{background:var(--t-cw)} .seg-cr{background:var(--t-cr)} .seg-out{background:var(--t-out)}
.spendn{font-family:var(--mono);font-size:11.5px;color:var(--fg-2);white-space:nowrap}
.spendn b{color:var(--fg);font-weight:700}
.spendn .u{color:var(--fg-3);font-size:9px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;margin-left:3px}
.substats{font-family:var(--mono);font-size:10px;color:var(--fg-3);white-space:nowrap}

/* ── Activity feed (below) ─────────────────────────────────────────────── */
.filters{display:flex;gap:7px;margin:0 2px 16px;flex-wrap:wrap}
.fc{display:inline-flex;align-items:center;gap:7px;padding:6px 12px;border-radius:999px;
  background:var(--bg3);border:1px solid var(--border);color:var(--fg-2);
  font-family:var(--ui);font-size:11.5px;font-weight:600;cursor:pointer;transition:all .12s}
.fc:hover{border-color:var(--border-2);color:var(--fg)}
.fc.active{color:var(--fg);background:var(--accent-soft);border-color:rgba(79,140,255,.45)}
.fc .dot{width:8px;height:8px;border-radius:3px}
.fc .n{font-family:var(--mono);font-size:11px;color:var(--fg-3)}
.feed{position:relative;padding-left:4px}
.feed::before{content:'';position:absolute;left:19px;top:6px;bottom:6px;width:2px;
  background:linear-gradient(180deg,var(--border-2),var(--border) 40%,transparent);pointer-events:none}
.ev{position:relative;display:flex;gap:15px;padding:9px 0;align-items:flex-start}
.ev .node{position:relative;z-index:1;width:32px;height:32px;border-radius:9px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;background:var(--bg3);border:1px solid var(--border-2)}
.ev .node svg{width:15px;height:15px}
.ev.cat-recon .node{color:var(--c-recon);border-color:rgba(91,147,214,.4)}
.ev.cat-vuln .node{color:var(--c-vuln);border-color:rgba(240,86,77,.4)}
.ev.cat-credential .node{color:var(--c-credential);border-color:rgba(139,151,166,.4)}
.ev.cat-access .node{color:var(--c-access);border-color:rgba(63,185,80,.4)}
.ev.cat-pivot .node{color:var(--c-pivot);border-color:rgba(214,165,51,.4)}
.ev.cat-blocked .node{color:var(--c-blocked);border-color:rgba(224,107,77,.4)}
.ev.cat-other .node{color:var(--c-other)}
.ev .body{flex:1;min-width:0;background:var(--surface-2);border:1px solid var(--border);border-radius:11px;
  padding:11px 14px;box-shadow:var(--sh-sm);transition:border-color .12s}
.ev:hover .body{border-color:var(--border-2)}
.ev.upd .body{background:var(--surface);opacity:.82}
.ev .top{display:flex;align-items:center;gap:9px;margin-bottom:3px}
.ev .cat{font-family:var(--ui);font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.ev.cat-recon .cat{color:var(--c-recon)} .ev.cat-vuln .cat{color:var(--c-vuln)}
.ev.cat-credential .cat{color:var(--c-credential)} .ev.cat-access .cat{color:var(--c-access)}
.ev.cat-pivot .cat{color:var(--c-pivot)} .ev.cat-blocked .cat{color:var(--c-blocked)} .ev.cat-other .cat{color:var(--c-other)}
.ev .updtag{font-family:var(--ui);font-size:8.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  color:var(--fg-3);background:var(--bg3);border:1px solid var(--border);border-radius:4px;padding:1px 5px}
.ev .agent{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--accent-2)}
.ev .time{font-family:var(--mono);font-size:10px;color:var(--fg-3);white-space:nowrap}
.ev .summary{font-size:13px;color:var(--fg);line-height:1.45;word-break:break-word}
.ev.flash .body{animation:flash 1.4s ease-out}
@keyframes flash{0%{border-color:var(--accent);box-shadow:0 0 16px var(--accent-soft)}100%{}}
.empty-card{background:linear-gradient(180deg,var(--surface-2),var(--surface));border:1px solid var(--border);
  border-radius:16px;padding:34px 24px;text-align:center;color:var(--fg-3);font-size:13px;margin-top:4px}
.empty-card .big{font-size:15px;font-weight:600;color:var(--fg-2);margin-bottom:8px}
@media (max-width:760px){body{padding:18px 16px 40px}.grid{grid-template-columns:1fr}.hero-top{flex-direction:column}.hero-right{align-items:flex-start}.ev .agent{margin-left:0}}
</style></head>
<body>
<span class="conn" id="conn">loading&hellip;</span>
<div class="wrap">
  <div id="team-slot"></div>
  <div class="sec-label">Activity <span class="n" id="evcount"></span></div>
  <div class="filters" id="filters"></div>
  <div id="feed"></div>
</div>

<script>
const connEl=document.getElementById('conn');
function setConn(ok,msg){connEl.textContent=msg;connEl.className='conn '+(ok?'ok':'bad');}
function esc(s){return (s??'').toString().replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function fmt(n){n=n||0;
  if(n>=1e9) return (n/1e9).toFixed(2).replace(/\.00$/,'')+'B';
  if(n>=1e6) return (n/1e6).toFixed(2).replace(/\.00$/,'')+'M';
  if(n>=1e3) return (n/1e3).toFixed(1).replace(/\.0$/,'')+'k';
  return String(n);}
function relTime(iso){
  if(!iso) return '';
  const t=Date.parse(iso.endsWith('Z')?iso:iso+'Z'); if(isNaN(t)) return esc(iso);
  const s=Math.max(0,(Date.now()-t)/1000);
  if(s<60) return Math.floor(s)+'s ago';
  if(s<3600) return Math.floor(s/60)+'m ago';
  if(s<86400) return Math.floor(s/3600)+'h ago';
  return Math.floor(s/86400)+'d ago';
}

/* ── Team roster ───────────────────────────────────────────────────────── */
const TCATS=[['input','seg-input'],['cache_write','seg-cw'],['cache_read','seg-cr'],['output','seg-out']];
const WEIGHTS={input:1,cache_write:1.25,cache_read:0.1,output:5};
let teamData=null, mode='raw', teamActiveOnly=false;
try{mode=localStorage.getItem('team-mode')||'raw';}catch(e){}
try{teamActiveOnly=localStorage.getItem('team-active-only')==='1';}catch(e){}
const wval=(o,k)=> mode==='billed' ? (o[k]||0)*WEIGHTS[k] : (o[k]||0);
const wtotal=(o)=> TCATS.reduce((s,[k])=>s+wval(o,k),0);
function minibar(tm){
  const tot=wtotal(tm); if(!tot) return '<div class="minibar"></div>';
  return '<div class="minibar">'+TCATS.map(([k,cls])=>{
    const v=wval(tm,k); if(!v) return '';
    return `<span class="${cls}" style="width:${(100*v/tot).toFixed(2)}%" title="${k}: ${(tm[k]||0).toLocaleString()} tokens"></span>`;
  }).join('')+'</div>';
}
function card(tm){
  const st=tm.status||'idle';
  const la=tm.last_activity;
  const label= st==='active' ? 'now' : 'last';
  const task = la && la.summary
    ? `<div class="task"><span class="lab">${label}</span><span class="txt">${esc(la.summary)}<span class="when">${relTime(la.created_at)}</span></span></div>`
    : `<div class="task none"><span class="lab">last</span><span class="txt">no recorded state activity</span></div>`;
  const flags=[];
  if(tm.aup) flags.push('<span class="flag aup">⚠ AUP content-filter flag</span>');
  if(tm.blocked) flags.push(`<span class="flag blk">⚠ ${tm.blocked} blocked</span>`);
  const flagsHtml=flags.length?`<div class="flags">${flags.join('')}</div>`:'';
  const model=(tm.models&&tm.models.length)?`<span class="model">${esc(tm.models[0])}${tm.models.length>1?' +'+(tm.models.length-1):''}</span>`:'';
  const tmTotal= mode==='billed'?wtotal(tm):tm.total;
  const unit= mode==='billed'?'billed-wt':'';
  return `<div class="card ${st}">
    <div class="chead"><span class="sdot"></span><span class="cname">${esc(tm.name)}</span>
      <span class="sbadge ${st}">${st}</span>${model}</div>
    ${task}${flagsHtml}
    <div class="spend-sep"></div>
    <div class="spendrow">${minibar(tm)}
      <span class="spendn"><b>${fmt(tmTotal)}</b>${unit?`<span class="u">${unit}</span>`:''}</span>
      <span class="substats">${tm.turns.toLocaleString()} turns</span></div>
  </div>`;
}
function renderTeam(d){
  const slot=document.getElementById('team-slot');
  if(!d||!d.available){ slot.innerHTML=''; return; }
  const billed=mode==='billed';
  const t=d.totals, r=d.roster||{};
  const grand=billed?wtotal(t):t.total;
  const toggle=`<div class="modeswitch">
      <button class="ms ${billed?'':'active'}" onclick="setMode('raw')">Raw</button>
      <button class="ms ${billed?'active':''}" onclick="setMode('billed')">Billed-weight</button></div>`;
  // Active-only roster filter (per-viewer). Hides idle teammates; flagged ones
  // stay visible since they are alerts the operator needs to see.
  const shown = teamActiveOnly ? d.teammates.filter(tm => (tm.status||'idle')!=='idle') : d.teammates;
  const hidden = d.teammates.length - shown.length;
  const activeToggle=`<button class="teamfilter ${teamActiveOnly?'on':''}" `
    + `onclick="setActiveOnly(${!teamActiveOnly})" title="${teamActiveOnly?'Show all teammates':'Show only active (and flagged) teammates'}">`
    + `<span class="d"></span>Active only</button>`;
  slot.innerHTML=`<div class="hero">
    <div class="hero-top">
      <div>
        <div class="eyebrow">Team</div>
        <h1>${t.teammates} teammate${t.teammates===1?'':'s'} <span class="dim">· ${r.active||0} active, ${r.idle||0} idle${r.flagged?', '+r.flagged+' flagged':''}</span></h1>
        <div class="statline">
          <span class="rs active"><span class="dot"></span><span class="n">${r.active||0}</span> active</span>
          <span class="rs idle"><span class="dot"></span><span class="n">${r.idle||0}</span> idle</span>
          ${r.flagged?`<span class="rs flagged"><span class="dot"></span><span class="n">${r.flagged}</span> flagged</span>`:''}
        </div>
      </div>
      <div class="hero-right">${activeToggle}${toggle}
        <div class="spend"><div class="v">${fmt(grand)}</div><div class="k">${billed?'billed-weight · total':'tokens · engagement total'}</div></div></div>
    </div>
    ${(r.alerts&&r.alerts.length)?`<div class="alert">
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.3 3.2 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.2a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/></svg>
      <div><b>${r.alerts.map(esc).join(', ')}</b> tripped a content filter (AUP sentinel in engagement/evidence/). Likely context-poisoned — dismiss &amp; respawn with a clean context.</div></div>`:''}
  </div>
  <div class="sec-label">Roster${teamActiveOnly&&hidden?` <span class="dim">· ${hidden} idle hidden</span>`:''}</div>
  <div class="grid">${shown.length?shown.map(card).join(''):'<div class="dim" style="padding:8px 2px">No active teammates right now.</div>'}</div>`;
}
function setMode(m){mode=m;try{localStorage.setItem('team-mode',m);}catch(e){};if(teamData)renderTeam(teamData);}
function setActiveOnly(v){teamActiveOnly=v;try{localStorage.setItem('team-active-only',v?'1':'0');}catch(e){};if(teamData)renderTeam(teamData);}
function loadTeam(){
  fetch('/api/team').then(r=>r.json()).then(d=>{teamData=d;renderTeam(d);}).catch(()=>{});
}

/* ── Activity feed ─────────────────────────────────────────────────────── */
const CATS=[['recon','Recon'],['access','Access'],['credential','Creds'],['vuln','Vulns'],['pivot','Pivots'],['blocked','Blocked']];
const ICONS={
  recon:'<path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/>',
  vuln:'<path d="M10.3 3.2 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.2a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/>',
  credential:'<rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>',
  access:'<path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><path d="M10 17l5-5-5-5M15 12H3"/>',
  pivot:'<path d="M4 7h11l-3-3M20 17H9l3 3"/>',
  blocked:'<circle cx="12" cy="12" r="9"/><path d="m5.5 5.5 13 13"/>',
  other:'<circle cx="12" cy="12" r="9"/><path d="M12 8v4M12 16h.01"/>',
};
let seen=new Set(), events=[], filter='all';
try{filter=localStorage.getItem('activity-filter')||'all';}catch(e){}
function icon(cat){return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICONS[cat]||ICONS.other}</svg>`;}
function evRow(e,flash){
  const cat=e.category||'other';
  return `<div class="ev cat-${cat}${e.is_update?' upd':''}${flash?' flash':''}">
    <div class="node">${icon(cat)}</div>
    <div class="body">
      <div class="top"><span class="cat">${esc(cat)}</span>${e.is_update?'<span class="updtag">update</span>':''}
        ${e.agent?`<span class="agent">${esc(e.agent)}</span>`:'<span class="agent"></span>'}
        <span class="time" title="${esc(e.created_at||'')}">${relTime(e.created_at)}</span></div>
      <div class="summary">${esc(e.summary||'')}</div>
    </div></div>`;
}
function renderFilters(){
  const bar=document.getElementById('filters');
  const chips=[['all','All']].concat(CATS).map(([k,l])=>{
    const n= k==='all'? events.length : events.filter(e=>(e.category||'other')===k).length;
    if(k!=='all' && !n) return '';
    const dot= k==='all'?'':`<span class="dot" style="background:var(--c-${k})"></span>`;
    return `<span class="fc${k===filter?' active':''}" data-f="${k}">${dot}${l}<span class="n">${n}</span></span>`;
  }).join('');
  bar.innerHTML=chips;
  for(const c of bar.querySelectorAll('.fc')){
    c.onclick=()=>{filter=c.dataset.f;try{localStorage.setItem('activity-filter',filter);}catch(e){};renderFilters();renderFeed();};
  }
  document.getElementById('evcount').textContent=events.length?`· ${events.length} events`:'';
}
function renderFeed(flashIds){
  const feed=document.getElementById('feed');
  const items=events.filter(e=> filter==='all' || (e.category||'other')===filter);
  if(!items.length){feed.innerHTML='<div class="empty-card"><div class="big">No activity yet</div>State changes appear here as teammates work.</div>';return;}
  feed.innerHTML='<div class="feed">'+items.map(e=>evRow(e,flashIds&&flashIds.has(e.id))).join('')+'</div>';
}
function ingest(list,flash){
  const newIds=new Set();
  for(const e of list){ if(seen.has(e.id)) continue; seen.add(e.id); events.push(e); if(flash) newIds.add(e.id); }
  events.sort((a,b)=>b.id-a.id);
  if(events.length>500) events=events.slice(0,500);
  renderFilters(); renderFeed(flash?newIds:null);
}
function loadFeed(){
  fetch('/api/activity').then(r=>r.json()).then(d=>{
    if(d.available) ingest(d.events||[],false); else { renderFilters(); renderFeed(); }
    setConn(true,'live');
  }).catch(()=>setConn(false,'disconnected'));
}

/* ── boot ──────────────────────────────────────────────────────────────── */
loadTeam(); loadFeed();
try{
  const es=new EventSource('/api/stream');
  es.onmessage=(m)=>{
    const d=JSON.parse(m.data);
    if(d.type==='events' && d.payload){ ingest(d.payload,true); loadTeam(); }
    else if(d.type==='state' && d.payload && d.payload.events){ ingest(d.payload.events,true); loadTeam(); }
    setConn(true,'live');
  };
  es.onerror=()=>setConn(false,'reconnecting');
}catch(e){ setInterval(loadFeed,6000); }
setInterval(loadTeam,15000);
setInterval(()=>{ if(events.length) renderFeed(); },30000);
</script>
</body></html>
