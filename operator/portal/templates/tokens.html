<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>PEN-AGENT &middot; Token Usage</title>
<style>
:root{
  --bg:#090b0f;--bg2:#0e1217;--bg3:#161b22;
  --surface:#12161c;--surface-2:#161c24;
  --border:#1e242e;--border-2:#2a323e;
  --fg:#eef2f6;--fg-2:#aab4c0;--fg-3:#6a7482;
  --accent:#4f8cff;--accent-2:#7aa7ff;--accent-soft:rgba(79,140,255,.12);
  --green:#3fb950;--green-soft:rgba(63,185,80,.1);
  --red:#f0564d;--red-soft:rgba(240,86,77,.08);
  --amber:#d6a533;--amber-soft:rgba(214,165,51,.1);--purple:#a371f7;--slate:#8b97a6;
  /* token category colors */
  --t-input:#4f8cff;--t-cw:#d6a533;--t-cr:#5b6675;--t-out:#3fb950;
  --sh-sm:0 1px 2px rgba(0,0,0,.4);
  --sh-md:0 2px 4px rgba(0,0,0,.3),0 6px 16px rgba(0,0,0,.25);
  --ui:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono","Cascadia Code",Menlo,Consolas,monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:radial-gradient(1000px 500px at 85% -10%,rgba(79,140,255,.05),transparent 60%),var(--bg);
  color:var(--fg);font-family:var(--ui);font-size:13px;line-height:1.5;-webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;min-height:100vh;padding:28px 32px 64px}
.wrap{max-width:1180px;margin:0 auto}
.conn{position:fixed;top:14px;right:18px;font-size:10.5px;font-weight:600;letter-spacing:.04em;
  padding:4px 11px;border-radius:999px;border:1px solid var(--border-2);color:var(--fg-3);
  display:inline-flex;align-items:center;gap:6px;background:var(--bg3);z-index:20}
.conn::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--fg-3)}
.conn.ok{color:var(--green);border-color:rgba(63,185,80,.35);background:var(--green-soft)}
.conn.ok::before{background:var(--green);box-shadow:0 0 6px var(--green)}
.conn.bad{color:var(--red);border-color:rgba(240,86,77,.4);background:var(--red-soft)}
.conn.bad::before{background:var(--red)}

/* Hero */
.hero{position:relative;padding:26px 30px;border-radius:18px;overflow:hidden;
  background:linear-gradient(140deg,rgba(79,140,255,.07),rgba(79,140,255,0) 48%),
             linear-gradient(180deg,var(--surface-2),var(--surface));
  border:1px solid var(--border);box-shadow:var(--sh-md)}
.hero::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(122,167,255,.5),transparent)}
.hero .eyebrow{color:var(--fg-3);font-size:10px;font-weight:600;letter-spacing:.16em;text-transform:uppercase}
.hero-eyebrow-row{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:14px}
.modeswitch{display:flex;gap:2px;background:var(--bg3);border:1px solid var(--border);border-radius:9px;padding:3px}
.modeswitch .ms{appearance:none;background:transparent;border:none;color:var(--fg-3);
  font-family:var(--ui);font-size:11px;font-weight:600;padding:5px 12px;border-radius:6px;cursor:pointer;
  transition:color .12s,background .12s;white-space:nowrap}
.modeswitch .ms:hover{color:var(--fg)}
.modeswitch .ms.active{color:var(--fg);background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--border-2)}
.hero-top{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap}
.total-num{font-size:46px;font-weight:750;font-family:var(--mono);letter-spacing:-.03em;line-height:1;color:var(--fg)}
.total-num .u{font-size:17px;color:var(--fg-3);font-weight:600;margin-left:6px;font-family:var(--ui)}
.total-sub{color:var(--fg-2);font-size:12.5px;margin-top:8px}
.hero-stats{display:flex;gap:22px;flex-wrap:wrap}
.hs{display:flex;flex-direction:column;gap:3px}
.hs .k{font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--fg-3)}
.hs .v{font-size:16px;font-weight:700;color:var(--fg);font-family:var(--mono)}
/* overall stacked bar */
.stack{margin-top:22px;height:12px;border-radius:7px;overflow:hidden;display:flex;background:var(--bg3);border:1px solid var(--border)}
.stack span{display:block;height:100%}
.seg-input{background:var(--t-input)} .seg-cw{background:var(--t-cw)} .seg-cr{background:var(--t-cr)} .seg-out{background:var(--t-out)}
.legend{display:flex;gap:18px;flex-wrap:wrap;margin-top:14px}
.lg{display:inline-flex;align-items:center;gap:7px;font-size:11.5px;color:var(--fg-2)}
.lg .sw{width:11px;height:11px;border-radius:3px}
.lg .amt{color:var(--fg-3);font-family:var(--mono);font-size:11px;margin-left:2px}
.note{margin-top:14px;font-size:11.5px;color:var(--fg-3);line-height:1.5;
  padding:9px 13px;background:var(--bg3);border:1px solid var(--border);border-radius:9px}
.note b{color:var(--fg-2);font-weight:600}

.sec-label{display:flex;align-items:center;gap:10px;margin:30px 2px 14px;
  font-size:10.5px;font-weight:650;letter-spacing:.14em;text-transform:uppercase;color:var(--fg-3)}
.sec-label::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,var(--border),transparent)}

/* teammate rows */
.tlist{display:flex;flex-direction:column;gap:10px}
.tm{background:linear-gradient(180deg,var(--surface-2),var(--surface));border:1px solid var(--border);
  border-radius:14px;padding:15px 18px;box-shadow:var(--sh-sm);transition:border-color .12s}
.tm:hover{border-color:var(--border-2)}
.tm-head{display:flex;align-items:center;gap:12px}
.rank{font-family:var(--mono);font-size:12px;font-weight:700;color:var(--fg-3);width:22px;text-align:right;flex-shrink:0}
.tm-name{font-size:14.5px;font-weight:650;color:var(--fg);letter-spacing:-.01em}
.tm-models{display:flex;gap:5px;flex-wrap:wrap}
.mtag{font-family:var(--mono);font-size:9.5px;font-weight:600;color:var(--accent-2);
  background:var(--accent-soft);border:1px solid rgba(79,140,255,.25);border-radius:5px;padding:2px 7px}
.tm-total{margin-left:auto;text-align:right}
.tm-total .v{font-family:var(--mono);font-size:17px;font-weight:700;color:var(--fg);letter-spacing:-.01em}
.tm-total .k{font-size:9.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--fg-3)}
.tm-bar{margin-top:12px;height:10px;border-radius:6px;overflow:hidden;display:flex;background:var(--bg3);border:1px solid var(--border)}
.tm-bar span{display:block;height:100%}
.tm-meta{display:flex;gap:16px;flex-wrap:wrap;margin-top:11px;font-size:11px;color:var(--fg-3);font-family:var(--mono)}
.tm-meta .mi{display:inline-flex;align-items:center;gap:6px}
.tm-meta .mi .d{width:8px;height:8px;border-radius:2px}
.tm-meta .mi b{color:var(--fg-2);font-weight:600}
.tm-meta .sep{width:1px;height:12px;background:var(--border-2);align-self:center}

.empty-card{background:linear-gradient(180deg,var(--surface-2),var(--surface));border:1px solid var(--border);
  border-radius:16px;padding:40px 24px;text-align:center;color:var(--fg-3);font-size:13px;margin-top:4px}
.empty-card .big{font-size:15px;font-weight:600;color:var(--fg-2);margin-bottom:8px}
.empty-card code{color:var(--amber);background:var(--bg3);border:1px solid var(--border);border-radius:4px;padding:1px 6px;font-family:var(--mono)}

@media (max-width:760px){body{padding:18px 16px 40px}.hero{padding:22px}.total-num{font-size:36px}}
</style></head>
<body>
<span class="conn" id="conn">loading&hellip;</span>
<div class="wrap" id="root">
  <div class="empty-card">Loading token usage&hellip;</div>
</div>

<script>
const connEl=document.getElementById('conn');
function setConn(ok,msg){connEl.textContent=msg;connEl.className='conn '+(ok?'ok':'bad');}
function esc(s){return (s??'').toString().replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function fmt(n){
  n=n||0;
  if(n>=1e9) return (n/1e9).toFixed(2).replace(/\.00$/,'')+'B';
  if(n>=1e6) return (n/1e6).toFixed(2).replace(/\.00$/,'')+'M';
  if(n>=1e3) return (n/1e3).toFixed(1).replace(/\.0$/,'')+'k';
  return String(n);
}
const CATS=[
  {k:'input',label:'Input',color:'var(--t-input)',cls:'seg-input'},
  {k:'cache_write',label:'Cache write',color:'var(--t-cw)',cls:'seg-cw'},
  {k:'cache_read',label:'Cache read',color:'var(--t-cr)',cls:'seg-cr'},
  {k:'output',label:'Output',color:'var(--t-out)',cls:'seg-out'},
];
// Relative per-token cost weights (base = fresh input = 1). Output is ~5x input
// across current Claude models; cache-write ~1.25x; cache-read ~0.1x. These give
// a "billed-equivalent" unit so the bars reflect spend, not raw volume.
const WEIGHTS={input:1,cache_write:1.25,cache_read:0.1,output:5};
let tokensData=null;
let mode='raw';  // 'raw' | 'billed'
try{mode=localStorage.getItem('tokens-mode')||'raw';}catch(e){}

const wval=(o,k)=> mode==='billed' ? (o[k]||0)*WEIGHTS[k] : (o[k]||0);
const wtotal=(o)=> CATS.reduce((s,c)=>s+wval(o,c.k),0);

function stackBar(o,cls){
  const total=wtotal(o);
  if(!total) return '<div class="'+cls+'"></div>';
  return '<div class="'+cls+'">'+CATS.map(c=>{
    const v=wval(o,c.k); if(!v) return '';
    const pct=(100*v/total).toFixed(3);
    const raw=(o[c.k]||0).toLocaleString();
    return `<span class="${c.cls}" style="width:${pct}%" title="${c.label}: ${raw} tokens"></span>`;
  }).join('')+'</div>';
}

function render(d){
  if(!d.available){
    document.getElementById('root').innerHTML=
      `<div class="empty-card"><div class="big">No token data yet</div>
        ${esc(d.reason||'')}<br><br>
        Metrics appear once teammates run — the <code>TeammateIdle</code> hook saves each
        teammate transcript to <code>engagement/evidence/logs/</code>, and this tab
        aggregates token usage from them.</div>`;
    return;
  }
  const billed=mode==='billed';
  const t=d.totals;
  const grand=billed?wtotal(t):t.total;
  const unit=billed?'billed-weight':'tokens total';
  // teammates sorted by the active metric
  const mates=d.teammates.slice().sort((a,b)=>wtotal(b)-wtotal(a));

  const toggle=`<div class="modeswitch" role="group" aria-label="weighting">
      <button class="ms ${billed?'':'active'}" onclick="setMode('raw')">Raw tokens</button>
      <button class="ms ${billed?'active':''}" onclick="setMode('billed')">Billed-weight</button>
    </div>`;

  let h='';
  h+=`<div class="hero">
    <div class="hero-eyebrow-row">
      <div class="eyebrow">Token Usage &middot; ${t.teammates} teammate${t.teammates===1?'':'s'}</div>
      ${toggle}
    </div>
    <div class="hero-top">
      <div>
        <div class="total-num">${fmt(grand)}<span class="u">${unit}</span></div>
        <div class="total-sub">across ${t.turns.toLocaleString()} model turns and ${t.tool_calls.toLocaleString()} tool calls</div>
      </div>
      <div class="hero-stats">
        ${CATS.map(c=>`<div class="hs"><span class="k">${c.label}</span><span class="v" style="color:${c.color}">${fmt(t[c.k])}</span></div>`).join('')}
      </div>
    </div>
    ${stackBar(t,'stack')}
    <div class="legend">
      ${CATS.map(c=>`<span class="lg"><span class="sw" style="background:${c.color}"></span>${c.label}<span class="amt">${fmt(t[c.k])}</span></span>`).join('')}
    </div>
    <div class="note">${billed
      ? `<b>Billed-weight:</b> bars and totals are weighted by relative per-token cost (input ×1, cache-write ×1.25, cache-read ×0.1, output ×5) to approximate spend. Per-category numbers below stay as raw token counts.`
      : `<b>Reading this:</b> cache-read tokens are the bulk but the cheapest (prompt-cache hits, ~10% of input price). <b>Output</b> and <b>cache-write</b> are the real cost drivers — switch to <b>Billed-weight</b> to rank by approximate spend.`}</div>
  </div>`;

  h+=`<div class="sec-label">Where tokens go &middot; by teammate${billed?' (by spend)':''}</div><div class="tlist">`;
  mates.forEach((tm,i)=>{
    const models=tm.models&&tm.models.length
      ? `<div class="tm-models">${tm.models.map(m=>`<span class="mtag">${esc(m)}</span>`).join('')}</div>` : '';
    const tmTotal=billed?wtotal(tm):tm.total;
    h+=`<div class="tm">
      <div class="tm-head">
        <span class="rank">${i+1}</span>
        <span class="tm-name">${esc(tm.name)}</span>
        ${models}
        <div class="tm-total"><div class="v">${fmt(tmTotal)}</div><div class="k">${billed?'billed-wt':'tokens'}</div></div>
      </div>
      ${stackBar(tm,'tm-bar')}
      <div class="tm-meta">
        ${CATS.map(c=>`<div class="mi"><span class="d" style="background:${c.color}"></span>${c.label} <b>${fmt(tm[c.k])}</b></div>`).join('<div class="sep"></div>')}
        <div class="sep"></div>
        <div class="mi"><b>${tm.turns.toLocaleString()}</b> turns</div>
        <div class="sep"></div>
        <div class="mi"><b>${tm.tool_calls.toLocaleString()}</b> tool calls</div>
        ${tm.sessions>1?'<div class="sep"></div><div class="mi"><b>'+tm.sessions+'</b> sessions</div>':''}
      </div>
    </div>`;
  });
  h+=`</div>`;
  document.getElementById('root').innerHTML=h;
}

function setMode(m){
  mode=m;
  try{localStorage.setItem('tokens-mode',m);}catch(e){}
  if(tokensData) render(tokensData);
}

function load(){
  fetch('/api/tokens').then(r=>r.json())
    .then(d=>{tokensData=d;render(d);setConn(true,'live');})
    .catch(()=>setConn(false,'disconnected'));
}
load();
setInterval(load,8000);
</script>
</body></html>
