<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>PEN-AGENT &middot; Objective &amp; Scope</title>
<style>
:root{
  --bg:#0a0c10;--surface:#11151b;--surface-2:#161b22;--surface-3:#1c222b;
  --border:#222935;--border-strong:#2f3744;
  --fg:#e6edf3;--fg-muted:#9aa5b1;--fg-dim:#6b7682;
  --accent:#4f8cff;--accent-2:#7aa7ff;--accent-glow:rgba(79,140,255,.16);
  --green:#3fb950;--red:#f85149;--amber:#d6a533;
  --ui:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,"SF Mono","Cascadia Code","JetBrains Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--ui);
     height:100vh;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
header{padding:8px 18px;min-height:50px;border-bottom:1px solid var(--border);display:flex;
       align-items:center;gap:10px 14px;flex-shrink:0;flex-wrap:wrap;
       background:linear-gradient(180deg,var(--surface-2),var(--surface))}
header h1{font-size:13px;margin:0;color:var(--fg);font-weight:600;letter-spacing:.03em}
header h1 .k{color:var(--accent)}
#status{font-size:11px;font-weight:600;letter-spacing:.03em;padding:3px 10px;border-radius:999px;
        border:1px solid var(--border-strong);color:var(--fg-dim);display:inline-flex;align-items:center;gap:6px}
#status::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--fg-dim)}
#status.ok{color:var(--green);border-color:rgba(63,185,80,.5);background:rgba(63,185,80,.08)}
#status.ok::before{background:var(--green);box-shadow:0 0 6px var(--green)}
#status.bad{color:var(--red);border-color:rgba(248,81,73,.5);background:rgba(248,81,73,.08)}
#status.bad::before{background:var(--red);box-shadow:0 0 6px var(--red)}
.attach{font-size:11px;color:var(--fg-dim);font-family:var(--ui)}
.attach code{color:var(--amber);font-family:var(--mono);background:var(--surface-3);
       border:1px solid var(--border);border-radius:5px;padding:2px 6px;margin-left:4px}

main{flex:1;display:flex;min-height:0}
#side{width:340px;border-right:1px solid var(--border);overflow-y:auto;flex-shrink:0;
      background:var(--surface)}
section{padding:14px 16px;border-bottom:1px solid var(--border)}
section h2{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--fg-dim);
       font-weight:600;margin:0 0 10px;display:flex;align-items:center;gap:7px}
section h2::before{content:"";width:3px;height:11px;background:var(--accent);border-radius:2px}
section h2 .n{color:var(--fg-dim);font-weight:500;letter-spacing:0;text-transform:none;font-family:var(--mono);margin-left:auto}
.kvs{display:flex;flex-direction:column;gap:10px}
.kv{display:flex;flex-direction:column;gap:3px}
.kv .k{font-size:9.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--fg-dim)}
.kv .v{font-size:13px;font-weight:600;color:var(--fg);font-family:var(--mono);word-break:break-word}

.pill{display:inline-flex;align-items:center;font-size:11px;font-weight:600;padding:3px 9px;
      margin:3px 5px 0 0;border-radius:999px;border:1px solid var(--border-strong);color:var(--fg-muted);
      font-family:var(--mono);background:var(--surface-3)}
.status-active{color:var(--green);border-color:rgba(63,185,80,.5);background:rgba(63,185,80,.1)}
.status-closed{color:var(--amber);border-color:rgba(214,165,51,.5);background:rgba(214,165,51,.1)}
#allow .pill{border-color:rgba(63,185,80,.45);color:var(--green);background:rgba(63,185,80,.08);
   display:block;margin:0 0 4px 0;text-align:center}
.empty{color:var(--fg-dim);font-size:12px;padding:6px 2px;font-family:var(--ui)}

#pane{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--bg)}
#panehead{padding:11px 16px;border-bottom:1px solid var(--border);font-size:12px;color:var(--fg-dim);
   display:flex;align-items:center;gap:10px;flex-shrink:0;background:var(--surface)}
#panetitle{color:var(--fg);font-weight:600;font-size:12px}
#panebody{flex:1;overflow-y:auto;padding:20px 24px;white-space:pre-wrap;word-break:break-word;
   font-family:var(--mono);font-size:13px;line-height:1.6;color:var(--fg-muted)}

@media (max-width:860px){
  main{flex-direction:column}
  #side{width:100%;max-height:46vh;border-right:none;border-bottom:1px solid var(--border)}
  #allow .pill{display:inline-flex;margin:3px 5px 0 0;text-align:left}
}
@media (max-width:620px){
  .attach{display:none}
  #panebody{padding:16px 16px;font-size:12.5px}
}
</style></head>
<body>
<header>
  <h1><span class="k">SCOPE</span> &middot; Objective &amp; Rules of Engagement</h1>
  <span id="status">loading&hellip;</span>
  <span style="flex:1"></span>
  <span class="attach">edit in <code>engagement/scope.md</code></span>
</header>
<main>
  <div id="side">
    <section>
      <h2>Engagement</h2>
      <div class="kvs" id="meta"></div>
    </section>
    <section>
      <h2>In&#8209;scope allowlist <span class="n" id="allow-count"></span></h2>
      <div id="allow"></div>
      <div class="empty" id="allow-empty" style="display:none">scope.allow empty — enforcement OFF.</div>
    </section>
  </div>
  <div id="pane">
    <div id="panehead">
      <span id="panetitle">engagement/scope.md</span>
      <span style="flex:1"></span>
      <span class="attach">rules of engagement &middot; raw</span>
    </div>
    <div id="panebody">loading…</div>
  </div>
</main>

<script>
const statusEl = document.getElementById('status');
function esc(s){return (s??'').toString().replace(/&/g,'&amp;').replace(/</g,'&lt;');}
function setStatus(ok, msg){ statusEl.textContent = msg; statusEl.className = ok ? 'ok' : 'bad'; }
function render(d){
  const e = d.engagement;
  const meta = document.getElementById('meta');
  if (e) {
    const st = (e.status||'').toLowerCase();
    meta.innerHTML =
      `<div class="kv"><span class="k">Name</span><span class="v">${esc(e.name)||'(unnamed)'}</span></div>`
      + `<div class="kv"><span class="k">Mode</span><span class="v">${esc(e.mode)}</span></div>`
      + `<div class="kv"><span class="k">Status</span><span><span class="pill status-${esc(st)}">${esc(e.status)}</span></span></div>`
      + `<div class="kv"><span class="k">Started</span><span class="v">${esc(e.created_at)}</span></div>`;
  } else {
    meta.innerHTML = '<span class="empty">No engagement initialized yet.</span>';
  }
  const allow = document.getElementById('allow');
  const allowEmpty = document.getElementById('allow-empty');
  const allowCount = document.getElementById('allow-count');
  if (d.scope_allow && d.scope_allow.length) {
    allow.innerHTML = d.scope_allow.map(a => `<span class="pill">${esc(a)}</span>`).join('');
    allowCount.textContent = `(${d.scope_allow.length})`;
    allowEmpty.style.display = 'none';
  } else {
    allow.innerHTML = '';
    allowCount.textContent = '';
    allowEmpty.style.display = 'block';
  }
  const body = document.getElementById('panebody');
  body.textContent = d.scope_md && d.scope_md.trim() ? d.scope_md
    : 'scope.md not written yet — the orchestrator creates it at engagement start.';
}
function load(){
  fetch('/api/scope')
    .then(r=>r.json())
    .then(d=>{ render(d); setStatus(true, 'live'); })
    .catch(()=>setStatus(false, 'disconnected'));
}
load();
setInterval(load, 5000);
</script>
</body></html>
