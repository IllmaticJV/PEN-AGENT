<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>PEN-AGENT &middot; C2 / MSF Logs</title>
<style>
:root{
  --bg:#0a0c10;--surface:#11151b;--surface-2:#161b22;--surface-3:#1c222b;
  --border:#222935;--border-strong:#2f3744;
  --fg:#e6edf3;--fg-muted:#9aa5b1;--fg-dim:#6b7682;
  --accent:#4f8cff;--accent-2:#7aa7ff;--accent-glow:rgba(79,140,255,.16);
  --green:#3fb950;--red:#f85149;--amber:#d6a533;
  --ui:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,"SF Mono","Cascadia Code","JetBrains Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--ui);
     height:100vh;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
header{padding:8px 18px;min-height:50px;border-bottom:1px solid var(--border);display:flex;
       align-items:center;gap:10px 14px;flex-shrink:0;flex-wrap:wrap;
       background:linear-gradient(180deg,var(--surface-2),var(--surface))}
header h1{font-size:13px;margin:0;color:var(--fg);font-weight:600;letter-spacing:.03em}
header h1 .k{color:var(--accent)}
#status{font-size:11px;font-weight:600;letter-spacing:.03em;padding:3px 10px;border-radius:999px;
        border:1px solid var(--border-strong);color:var(--fg-dim);display:inline-flex;align-items:center;gap:6px}
#status::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--fg-dim)}
#status.ok{color:var(--green);border-color:rgba(63,185,80,.5);background:rgba(63,185,80,.08)}
#status.ok::before{background:var(--green);box-shadow:0 0 6px var(--green)}
#status.bad{color:var(--red);border-color:rgba(248,81,73,.5);background:rgba(248,81,73,.08)}
#status.bad::before{background:var(--red);box-shadow:0 0 6px var(--red)}
.attach{font-size:11px;color:var(--fg-dim);font-family:var(--ui)}
.attach code{color:var(--amber);font-family:var(--mono);background:var(--surface-3);
       border:1px solid var(--border);border-radius:5px;padding:2px 6px;margin-left:4px}
main{flex:1;display:flex;min-height:0}
#side{width:340px;border-right:1px solid var(--border);overflow-y:auto;flex-shrink:0;
      background:var(--surface)}
section{padding:14px 16px;border-bottom:1px solid var(--border)}
section h2{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--fg-dim);
       font-weight:600;margin:0 0 10px;display:flex;align-items:center;gap:7px}
section h2::before{content:"";width:3px;height:11px;background:var(--accent);border-radius:2px}
table{width:100%;border-collapse:collapse;font-size:12px;font-family:var(--mono)}
td{padding:5px 6px;border-bottom:1px solid var(--border);vertical-align:top;color:var(--fg-muted)}
tr:last-child td{border-bottom:none}
td.id{color:var(--accent);cursor:pointer;white-space:nowrap;font-weight:600}
td.id:hover{color:var(--accent-2)}
tr.sel{background:var(--accent-glow)}
tr.sel td.id{color:var(--amber);font-weight:700}
tr:hover td{background:rgba(255,255,255,.02)}
.opbadge{color:var(--green);font-size:9px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;
         border:1px solid rgba(63,185,80,.5);background:rgba(63,185,80,.1);border-radius:999px;
         padding:1px 6px;margin-left:7px;white-space:nowrap;font-family:var(--ui)}
.empty{color:var(--fg-dim);font-size:12px;padding:6px 2px;font-family:var(--ui)}
#logwrap{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--bg)}
#loghead{padding:11px 16px;border-bottom:1px solid var(--border);font-size:12px;color:var(--fg-dim);
         display:flex;align-items:center;gap:10px;flex-shrink:0;background:var(--surface)}
#logtitle{color:var(--fg);font-weight:600;font-size:12px}
#log{flex:1;overflow-y:auto;padding:16px 18px;white-space:pre-wrap;word-break:break-all;
     font-family:var(--mono);font-size:12.5px;line-height:1.5;color:var(--fg-muted)}
.rec{margin:0 0 16px;border-left:2px solid var(--border-strong);padding-left:12px}
.rec .cmd{color:var(--green);font-weight:600}
.rec .cmd::before{content:"$ ";color:var(--fg-dim)}
.rec .ts{color:var(--fg-dim);font-size:11px;margin-left:8px;font-weight:400}
.rec .out{color:var(--fg-muted);margin-top:4px}
.pill{font-size:11px;font-weight:600;letter-spacing:.03em;padding:4px 11px;border:1px solid var(--border-strong);
      border-radius:999px;cursor:pointer;color:var(--fg-dim);font-family:var(--ui);
      background:var(--surface-3);transition:color .15s,border-color .15s}
.pill:hover{color:var(--fg)}
.pill.active{color:var(--accent);border-color:var(--accent);background:var(--accent-glow)}
@media (max-width:860px){
  main{flex-direction:column}
  #side{width:100%;max-height:40vh;border-right:none;border-bottom:1px solid var(--border)}
}
@media (max-width:620px){
  .attach{display:none}
  #side{max-height:46vh}
}
</style></head>
<body>
<header>
  <h1><span class="k">C2</span> &middot; Metasploit Console</h1>
  <span id="status">connecting&hellip;</span>
  <span style="flex:1"></span>
  <span class="attach">read&#8209;only viewer &middot; interact in the live console:
    <code>tmux attach -t pen-msf</code></span>
</header>
<main>
  <div id="side">
    <section>
      <h2>Sessions</h2>
      <table id="sessions"><tbody></tbody></table>
      <div class="empty" id="sessions-empty">none yet</div>
    </section>
    <section>
      <h2>Listeners / Jobs</h2>
      <table id="jobs"><tbody></tbody></table>
      <div class="empty" id="jobs-empty">none yet</div>
    </section>
  </div>
  <div id="logwrap">
    <div id="loghead">
      <span id="logtitle">Select a session to view its command log</span>
      <span style="flex:1"></span>
      <span class="pill" id="pill-console" onclick="showConsole()">console spool</span>
    </div>
    <div id="log"></div>
  </div>
</main>
<script>
const statusEl = document.getElementById('status');
const logEl = document.getElementById('log');
const logTitle = document.getElementById('logtitle');
let selectedSid = null;   // viewing a session log
let viewConsole = false;  // viewing the console spool instead
let sessionsCache = [];

function setStatus(connected, msg) {
  statusEl.textContent = msg || (connected ? 'connected' : 'disconnected');
  statusEl.className = connected ? 'ok' : 'bad';
}

function esc(s) { return (s ?? '').toString().replace(/&/g,'&amp;').replace(/</g,'&lt;'); }

function renderTable(id, emptyId, rows, cols, onClick) {
  const tbody = document.querySelector('#' + id + ' tbody');
  tbody.innerHTML = '';
  document.getElementById(emptyId).style.display = rows.length ? 'none' : 'block';
  for (const row of rows) {
    const tr = document.createElement('tr');
    if (id === 'sessions' && String(row.session_id) === String(selectedSid)) tr.className = 'sel';
    const badge = (id === 'sessions' && row.operator_reserved)
      ? '<span class="opbadge">operator</span>' : '';
    tr.innerHTML = cols.map((c, i) =>
      `<td class="${i === 0 ? 'id' : ''}">${esc(row[c])}${i === 0 ? badge : ''}</td>`).join('');
    if (onClick) tr.querySelector('td.id').onclick = () => onClick(row);
    tbody.appendChild(tr);
  }
}

function selectSession(sid) {
  selectedSid = String(sid);
  viewConsole = false;
  document.getElementById('pill-console').classList.remove('active');
  logTitle.textContent = 'session ' + selectedSid + ' — command log';
  renderTable('sessions', 'sessions-empty', sessionsCache,
    ['session_id', 'type', 'info'], r => selectSession(r.session_id));
  refreshLog();
}

function showConsole() {
  viewConsole = true;
  selectedSid = null;
  document.getElementById('pill-console').classList.add('active');
  logTitle.textContent = 'shared msfconsole spool';
  renderTable('sessions', 'sessions-empty', sessionsCache,
    ['session_id', 'type', 'info'], r => selectSession(r.session_id));
  refreshLog();
}

function refreshLog() {
  if (viewConsole) {
    fetch('/api/console/log').then(r => r.json()).then(j => {
      logEl.textContent = j.data || (j.error ? '[error] ' + j.error : '(console spool empty — enable spool in tmux, or no activity yet)');
      logEl.scrollTop = logEl.scrollHeight;
    });
    return;
  }
  if (selectedSid === null) return;
  fetch('/api/session/log?id=' + encodeURIComponent(selectedSid)).then(r => r.json()).then(j => {
    const recs = j.records || [];
    if (!recs.length) { logEl.innerHTML = '<div class="empty">no commands recorded for this session yet</div>'; return; }
    logEl.innerHTML = recs.map(r =>
      `<div class="rec"><div class="cmd">${esc(r.command)}<span class="ts">${esc(r.ts)}</span></div>`
      + `<div class="out">${esc(r.output)}</div></div>`).join('');
    logEl.scrollTop = logEl.scrollHeight;
  }).catch(e => { logEl.textContent = '[error] ' + e; });
}

setInterval(refreshLog, 2000);

const es = new EventSource('/api/msf/stream');
es.onmessage = (ev) => {
  const msg = JSON.parse(ev.data);
  if (msg.type === 'sessions') {
    sessionsCache = msg.payload;
    renderTable('sessions', 'sessions-empty', msg.payload,
      ['session_id', 'type', 'info'], r => selectSession(r.session_id));
  } else if (msg.type === 'jobs') {
    renderTable('jobs', 'jobs-empty', msg.payload, ['job_id', 'name'], null);
  } else if (msg.type === 'status') {
    setStatus(msg.connected, msg.connected ? 'connected' : (msg.error || 'disconnected'));
  }
};
es.onerror = () => setStatus(false, 'stream lost — retrying');
</script>
</body></html>
