<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>PEN-AGENT &middot; Operator Console</title>
<style>
:root{
  --bg:#090b0f;--bg2:#0e1217;--bg3:#161b22;
  --surface:#12161c;--surface-2:#161c24;--surface-3:#1c222b;
  --border:#1e242e;--border-strong:#2a323e;
  --fg:#eef2f6;--fg-muted:#aab4c0;--fg-dim:#6a7482;
  --accent:#4f8cff;--accent-2:#7aa7ff;--accent-glow:rgba(79,140,255,.12);
  --green:#3fb950;--red:#f0564d;--amber:#d6a533;
  --ui:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono","Cascadia Code",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--ui);
     display:flex;flex-direction:column;height:100vh;-webkit-font-smoothing:antialiased;
     text-rendering:optimizeLegibility}
header{position:relative;display:flex;align-items:center;gap:22px;padding:0 20px;height:56px;flex-shrink:0;
       border-bottom:1px solid var(--border);
       background:linear-gradient(180deg,var(--surface-2),var(--surface));
       box-shadow:0 1px 0 rgba(0,0,0,.5)}
header::after{content:"";position:absolute;bottom:-1px;left:0;right:0;height:1px;
       background:linear-gradient(90deg,transparent,rgba(122,167,255,.18),transparent);pointer-events:none}
.brand{display:flex;align-items:center;gap:11px;white-space:nowrap}
.brand .mark{width:27px;height:27px;flex-shrink:0;filter:drop-shadow(0 0 7px var(--accent-glow))}
.brand .wm{display:flex;flex-direction:column;line-height:1.05}
.brand .name{font-size:14px;font-weight:700;letter-spacing:.04em;color:var(--fg)}
.brand .name b{color:var(--accent);font-weight:700}
.brand .sub{font-size:9.5px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--fg-dim)}
nav{display:flex;align-items:center;gap:3px;height:100%;min-width:0;
    overflow-x:auto;overflow-y:hidden;scrollbar-width:none;-ms-overflow-style:none}
nav::-webkit-scrollbar{display:none}
.tab{appearance:none;background:transparent;border:none;position:relative;white-space:nowrap;
     color:var(--fg-dim);font-family:var(--ui);font-size:12.5px;font-weight:550;letter-spacing:-.005em;
     padding:0 15px;height:34px;border-radius:9px;cursor:pointer;display:flex;align-items:center;
     transition:color .15s,background .15s}
.tab:hover{color:var(--fg);background:rgba(255,255,255,.03)}
.tab.active{color:var(--fg);background:var(--accent-soft,rgba(79,140,255,.12))}
.tab.active::after{content:"";position:absolute;left:14px;right:14px;bottom:-12px;height:2px;
     background:var(--accent);border-radius:2px 2px 0 0;box-shadow:0 0 8px var(--accent)}
.spacer{flex:1}
.ribbon{display:flex;align-items:center;gap:7px;font-size:10.5px;font-weight:600;
        letter-spacing:.04em;color:var(--fg-dim);padding:5px 12px;border:1px solid var(--border-strong);
        border-radius:999px;background:var(--bg3)}
.ribbon .dot{width:6px;height:6px;border-radius:50%;background:var(--amber);
        box-shadow:0 0 6px var(--amber)}
#frame{flex:1;border:none;width:100%;background:var(--bg)}
@media (max-width:760px){
  header{gap:12px;padding:0 12px}
  .brand .sub{display:none}
  .ribbon,.spacer{display:none}
  nav{flex:1 1 auto}
  .tab{padding:0 12px;font-size:12.5px}
  .tab.active::after{left:8px;right:8px}
}
@media (max-width:420px){
  .brand .name{font-size:13px}
  .brand .mark{width:22px;height:22px}
}
</style></head>
<body>
<header>
  <div class="brand">
    <svg class="mark" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path d="M16 2.5 27 7v9.2c0 7-4.7 11.6-11 13.3C9.7 27.8 5 23.2 5 16.2V7l11-4.5Z"
            fill="var(--accent-glow)" stroke="var(--accent)" stroke-width="1.6" stroke-linejoin="round"/>
      <path d="M12 13.3 15.6 16 12 18.7M17 19h4" stroke="var(--accent-2)" stroke-width="1.8"
            stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <div class="wm">
      <span class="name">PEN&#8209;<b>AGENT</b></span>
      <span class="sub">Operator Console</span>
    </div>
  </div>
  <nav>
    <button class="tab" data-tab="scope"      data-src="/scope">Objective &amp; Scope</button>
    <button class="tab" data-tab="objectives" data-src="/objectives">Objective Tracker</button>
    <button class="tab" data-tab="status"     data-src="/status">Status</button>
    <button class="tab" data-tab="graph"      data-src="/status?view=graph">Attack Graph</button>
    <button class="tab" data-tab="activity"   data-src="/activity">Activity</button>
    <button class="tab" data-tab="findings"   data-src="/findings">Findings</button>
    <button class="tab" data-tab="msf"        data-src="/msf">C2 / MSF Logs</button>
    <button class="tab" data-tab="tokens"     data-src="/tokens">Token Usage</button>
  </nav>
  <span class="spacer"></span>
  <span class="ribbon"><span class="dot"></span>Read&#8209;only</span>
</header>
<iframe id="frame" title="portal content"></iframe>
<script>
const frame = document.getElementById('frame');
const tabs = [...document.querySelectorAll('.tab')];
function show(name) {
  const tab = tabs.find(t => t.dataset.tab === name) || tabs[0];
  tabs.forEach(t => t.classList.toggle('active', t === tab));
  // Only reload the iframe if the tab actually changed, so a visible tab keeps its live SSE.
  const src = tab.dataset.src;
  if (frame.getAttribute('src') !== src) frame.setAttribute('src', src);
  try { localStorage.setItem('portal-tab', tab.dataset.tab); } catch (e) {}
}
tabs.forEach(t => t.addEventListener('click', () => show(t.dataset.tab)));
let initial = 'status';
try { initial = localStorage.getItem('portal-tab') || 'status'; } catch (e) {}
show(initial);
</script>
</body></html>
