<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>PEN-AGENT &middot; Objective Tracker</title>
<style>
:root{
  --bg:#090b0f;--bg2:#0e1217;--bg3:#161b22;
  --surface:#12161c;--surface-2:#161c24;
  --border:#1e242e;--border-2:#2a323e;
  --fg:#eef2f6;--fg-2:#aab4c0;--fg-3:#6a7482;
  --accent:#4f8cff;--accent-2:#7aa7ff;--accent-soft:rgba(79,140,255,.12);
  --green:#3fb950;--green-soft:rgba(63,185,80,.1);
  --red:#f0564d;--red-soft:rgba(240,86,77,.08);
  --amber:#d6a533;--amber-soft:rgba(214,165,51,.1);--purple:#a371f7;
  --sh-sm:0 1px 2px rgba(0,0,0,.4);
  --sh-md:0 2px 4px rgba(0,0,0,.3),0 6px 16px rgba(0,0,0,.25);
  --ui:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono","Cascadia Code",Menlo,Consolas,monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:radial-gradient(1000px 500px at 85% -10%,rgba(79,140,255,.05),transparent 60%),var(--bg);
  color:var(--fg);font-family:var(--ui);font-size:13px;line-height:1.5;-webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;min-height:100vh;padding:28px 32px 64px}
.wrap{max-width:1180px;margin:0 auto}
.conn{position:fixed;top:14px;right:18px;font-size:10.5px;font-weight:600;letter-spacing:.04em;
  padding:4px 11px;border-radius:999px;border:1px solid var(--border-2);color:var(--fg-3);
  display:inline-flex;align-items:center;gap:6px;background:var(--bg3);z-index:20}
.conn::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--fg-3)}
.conn.ok{color:var(--green);border-color:rgba(63,185,80,.35);background:var(--green-soft)}
.conn.ok::before{background:var(--green);box-shadow:0 0 6px var(--green)}
.conn.bad{color:var(--red);border-color:rgba(240,86,77,.4);background:var(--red-soft)}
.conn.bad::before{background:var(--red)}

.hero{display:grid;grid-template-columns:200px 1fr;gap:28px;align-items:center;
  padding:26px 30px;border-radius:18px;position:relative;overflow:hidden;
  background:linear-gradient(140deg,rgba(79,140,255,.06),rgba(79,140,255,0) 50%),
             linear-gradient(180deg,var(--surface-2),var(--surface));
  border:1px solid var(--border);box-shadow:var(--sh-md)}
.hero::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(122,167,255,.5),transparent)}
.ring{position:relative;width:170px;height:170px;margin:0 auto}
.ring .num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .num .big{font-size:44px;font-weight:750;font-family:var(--mono);color:var(--fg);letter-spacing:-.03em;line-height:1}
.ring .num .big .u{font-size:17px;color:var(--fg-3);font-weight:600;margin-left:2px}
.ring .num .sub{color:var(--fg-3);font-size:9.5px;font-weight:650;letter-spacing:.16em;text-transform:uppercase;margin-top:7px}
.hero-right{display:flex;flex-direction:column;gap:7px;min-width:0}
.hero-right .eyebrow{color:var(--fg-3);font-size:10px;font-weight:600;letter-spacing:.16em;text-transform:uppercase}
.hero-right h1{font-size:21px;font-weight:650;letter-spacing:-.02em;color:var(--fg);line-height:1.25}
.hero-right .lead{color:var(--fg-2);font-size:12.5px;line-height:1.55;max-width:600px}
.hero-right .lead b{color:var(--fg);font-weight:600}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.mini{display:inline-flex;align-items:center;gap:7px;padding:6px 12px;border-radius:9px;
  background:var(--bg3);border:1px solid var(--border);font-size:11px;font-weight:600;color:var(--fg-2)}
.mini .n{font-family:var(--mono);font-size:13px;font-weight:700}
.mini.done .n{color:var(--green)} .mini.in_progress .n{color:var(--accent)}
.mini.blocked .n{color:var(--red)} .mini.pending .n{color:var(--fg-2)} .mini.skipped .n{color:var(--purple)}
.mini .dot{width:7px;height:7px;border-radius:50%}
.mini.done .dot{background:var(--green)} .mini.in_progress .dot{background:var(--accent)}
.mini.blocked .dot{background:var(--red)} .mini.pending .dot{background:var(--fg-3)} .mini.skipped .dot{background:var(--purple)}
.synchint{margin-top:16px;padding:10px 13px;background:var(--amber-soft);border:1px solid rgba(214,165,51,.3);
  border-radius:9px;font-size:11.5px;color:var(--amber);font-family:var(--mono);line-height:1.45}

.filters{display:flex;gap:7px;margin:26px 2px 6px;flex-wrap:wrap}
.fc{display:inline-flex;align-items:center;gap:7px;padding:6px 13px;border-radius:999px;
  background:var(--bg3);border:1px solid var(--border);color:var(--fg-2);
  font-family:var(--ui);font-size:11.5px;font-weight:600;cursor:pointer;transition:all .12s}
.fc:hover{border-color:var(--border-2);color:var(--fg)}
.fc.active{color:var(--fg);background:var(--accent-soft);border-color:rgba(79,140,255,.45)}
.fc .n{font-family:var(--mono);font-size:11px;color:var(--fg-3)}
.fc.active .n{color:var(--accent-2)}

.gh{display:flex;align-items:center;gap:11px;margin:26px 2px 12px}
.gh .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.gh .ttl{font-size:10.5px;font-weight:650;letter-spacing:.14em;text-transform:uppercase;color:var(--fg-2)}
.gh .n{font-family:var(--mono);font-size:11px;color:var(--fg-3);background:var(--bg3);padding:1px 7px;border-radius:5px;border:1px solid var(--border)}
.gh::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,var(--border),transparent)}
.gh.in_progress .dot{background:var(--accent);box-shadow:0 0 8px var(--accent)}
.gh.blocked .dot{background:var(--red);box-shadow:0 0 8px rgba(240,86,77,.6)}
.gh.pending .dot{background:var(--fg-3)}
.gh.done .dot{background:var(--green);box-shadow:0 0 8px rgba(63,185,80,.6)}
.gh.skipped .dot{background:var(--purple);box-shadow:0 0 8px rgba(163,113,247,.5)}

.olist{display:flex;flex-direction:column;gap:7px}
.obj{display:grid;grid-template-columns:20px 40px 1fr auto;gap:14px;padding:13px 17px;
  background:linear-gradient(180deg,var(--surface-2),var(--surface));border:1px solid var(--border);
  border-radius:12px;align-items:center;box-shadow:var(--sh-sm);transition:border-color .12s,transform .12s}
.obj:hover{border-color:var(--border-2);transform:translateX(2px)}
.obj.in_progress{border-left:2px solid var(--accent)}
.obj.blocked{border-left:2px solid var(--red)}
.obj.skipped{border-left:2px solid var(--purple)}
.chk{appearance:none;-webkit-appearance:none;width:19px;height:19px;border:1.5px solid var(--border-2);
  border-radius:6px;background:transparent;cursor:pointer;position:relative;margin:0;transition:all .12s;flex-shrink:0}
.chk:hover{border-color:var(--accent)}
.chk:checked{background:var(--green);border-color:var(--green);box-shadow:0 0 8px rgba(63,185,80,.35)}
.chk:checked::after{content:'';position:absolute;left:4.5px;top:1px;width:6px;height:11px;border:solid #0a0c10;border-width:0 2px 2px 0;transform:rotate(45deg)}
.chk:disabled{opacity:.5;cursor:wait}
.oid{font-family:var(--mono);font-size:12px;font-weight:700;text-align:center;padding:3px 0;border-radius:6px;
  color:var(--accent);background:var(--accent-soft);border:1px solid rgba(79,140,255,.25)}
.obj.done .oid{color:var(--green);background:var(--green-soft);border-color:rgba(63,185,80,.25)}
.obj.blocked .oid{color:var(--red);background:var(--red-soft);border-color:rgba(240,86,77,.25)}
.obj.skipped .oid{color:var(--purple);background:rgba(163,113,247,.1);border-color:rgba(163,113,247,.25)}
.obody{min-width:0}
.obody .txt{font-size:13.5px;font-weight:500;color:var(--fg);line-height:1.4;overflow-wrap:anywhere}
.obj.done .obody .txt{color:var(--fg-2)}
.obj.skipped .obody .txt{color:var(--fg-3)}
.obody .note{display:flex;align-items:flex-start;gap:7px;font-size:11.5px;color:var(--fg-3);
  font-family:var(--mono);margin-top:5px;line-height:1.4;overflow-wrap:anywhere}
.obody .note::before{content:'';width:3px;height:3px;border-radius:50%;background:var(--fg-3);flex-shrink:0;margin-top:6px}
.obj.blocked .obody .note{color:#e89691}
.ometa{display:flex;align-items:center;gap:11px;white-space:nowrap}
.badge{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:7px;
  font-size:9.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-family:var(--ui)}
.badge.in_progress{color:var(--accent);background:var(--accent-soft);border:1px solid rgba(79,140,255,.3)}
.badge.blocked{color:var(--red);background:var(--red-soft);border:1px solid rgba(240,86,77,.3)}
.badge.pending{color:var(--fg-3);background:var(--bg3);border:1px solid var(--border)}
.badge.skipped{color:var(--purple);background:rgba(163,113,247,.12);border:1px solid rgba(163,113,247,.3)}
.time{font-family:var(--mono);font-size:10.5px;color:var(--fg-3)}
.unsync{color:var(--amber);font-weight:700;font-size:9.5px;letter-spacing:.04em;text-transform:uppercase}
.empty-card{background:linear-gradient(180deg,var(--surface-2),var(--surface));border:1px solid var(--border);
  border-radius:14px;padding:26px 20px;text-align:center;color:var(--fg-3);font-size:12.5px;font-family:var(--mono);margin-top:8px}
.empty-card code{color:var(--amber);background:var(--bg3);border:1px solid var(--border);border-radius:4px;padding:1px 5px}

@media (max-width:760px){body{padding:18px 16px 40px}.hero{grid-template-columns:1fr;gap:18px}.ring{width:140px;height:140px}}
</style></head>
<body>
<span class="conn" id="conn">loading&hellip;</span>
<div class="wrap">
  <div id="hero-slot"></div>
  <div class="filters" id="filters"></div>
  <div id="list"></div>
</div>

<script>
const STATUSES=["in_progress","blocked","pending","skipped","done"];       // display/group order
const COUNT_ORDER=["done","in_progress","blocked","skipped","pending"];     // hero chip order
const LABELS={done:"Done",in_progress:"In progress",blocked:"Blocked",skipped:"Skipped",pending:"Pending"};
const RING_C=2*Math.PI*72;
const connEl=document.getElementById('conn');
let dataCache=null, filter='all';
try{filter=localStorage.getItem('goals-filter')||'all';}catch(e){}
function setConn(ok,msg){connEl.textContent=msg;connEl.className='conn '+(ok?'ok':'bad');}
function esc(s){return (s??'').toString().replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function renderHero(d){
  const total=d.total||0, pct=total?d.percent:0;
  const counts=d.counts||{};
  const off=(RING_C*(1-pct/100)).toFixed(1);
  // headline: first in-progress objective, else a status line
  const inp=(d.objectives||[]).find(o=>(o.status||'')==='in_progress');
  const blk=(d.objectives||[]).find(o=>(o.status||'')==='blocked');
  let lead=`${d.completed||0} done · ${counts.in_progress||0} in progress · ${counts.pending||0} pending · ${counts.blocked||0} blocked.`;
  if(inp) lead+=` Current focus: <b>${esc(inp.text)}</b>.`;
  else if(blk) lead+=` Blocked on: <b>${esc(blk.text)}</b>.`;
  const chips=COUNT_ORDER.map(s=>`<span class="mini ${s}"><span class="dot"></span><span class="n">${counts[s]||0}</span>${esc(LABELS[s])}</span>`).join('');
  const sync=d.unsynced?`<div class="synchint">⚠ scope.md has objectives not yet in objectives.json — lead: run <b>mcp__state__init_objectives</b> to re-parse.</div>`:'';
  document.getElementById('hero-slot').innerHTML=`<div class="hero">
    <div class="ring">
      <svg width="170" height="170" viewBox="0 0 170 170" style="transform:rotate(-90deg)">
        <circle cx="85" cy="85" r="72" fill="none" stroke="#161b22" stroke-width="11"/>
        <circle cx="85" cy="85" r="72" fill="none" stroke="url(#g)" stroke-width="11" stroke-linecap="round"
                stroke-dasharray="${RING_C.toFixed(1)}" stroke-dashoffset="${off}"/>
        <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#3fb950"/><stop offset="100%" stop-color="#4f8cff"/></linearGradient></defs>
      </svg>
      <div class="num"><div class="big">${pct}<span class="u">%</span></div><div class="sub">complete</div></div>
    </div>
    <div class="hero-right">
      <div class="eyebrow">Objective Tracker</div>
      <h1>${total?`${d.completed||0} of ${total} objectives complete`:'No objectives yet'}</h1>
      <div class="lead">${total?lead:'Add an OBJECTIVES block to scope.md and run init_objectives.'}</div>
      <div class="chips">${chips}</div>
      ${sync}
    </div>
  </div>`;
}

function renderFilters(d){
  const total=d.total||0, counts=d.counts||{};
  const items=[{k:'all',n:total}].concat(COUNT_ORDER.map(s=>({k:s,n:counts[s]||0})));
  const bar=document.getElementById('filters');
  bar.innerHTML=items.map(i=>{
    const label=i.k==='all'?'All':LABELS[i.k];
    return `<span class="fc${i.k===filter?' active':''}" data-k="${i.k}">${esc(label)}<span class="n">${i.n}</span></span>`;
  }).join('');
  for(const c of bar.querySelectorAll('.fc')){
    c.onclick=()=>{filter=c.dataset.k;try{localStorage.setItem('goals-filter',filter);}catch(e){};renderFilters(dataCache);renderList(dataCache);};
  }
}

function objRow(o){
  const s=o.status||'pending';
  const checked=s==='done'?'checked':'';
  const note=o.note?`<div class="note">${esc(o.note)}</div>`:'';
  const t=o.updated_at?esc(o.updated_at.replace('T',' ').replace('Z','').slice(11,16)||o.updated_at):'';
  const unsync=o.unsynced?`<span class="unsync">unsynced</span>`:'';
  const badge=s!=='done'?`<span class="badge ${s}">${esc((LABELS[s]||s).toLowerCase())}</span>`:'';
  const pad=String(o.id).padStart(2,'0');
  return `<div class="obj ${s}" data-id="${esc(o.id)}" data-status="${esc(s)}">
    <input type="checkbox" class="chk" ${checked} aria-label="toggle objective ${esc(o.id)}">
    <span class="oid">${esc(pad)}</span>
    <div class="obody"><div class="txt">${esc(o.text)}</div>${note}</div>
    <div class="ometa">${badge}${unsync}<span class="time">${t}</span></div>
  </div>`;
}

function renderList(d){
  const list=document.getElementById('list');
  const total=d.total||0;
  if(!total){
    list.innerHTML=`<div class="empty-card">No objectives parsed yet. Add an OBJECTIVES block to <code>engagement/scope.md</code> and have the lead run <code>mcp__state__init_objectives</code>.</div>`;
    return;
  }
  const objs=d.objectives||[];
  let html='';
  if(filter!=='all'){
    const items=objs.filter(o=>(o.status||'pending')===filter);
    if(!items.length){list.innerHTML=`<div class="empty-card">No objectives in <b style="color:var(--fg-2)">${esc(LABELS[filter]||filter)}</b> yet.</div>`;return;}
    html=`<div class="olist">${items.map(objRow).join('')}</div>`;
  }else{
    for(const s of STATUSES){
      const items=objs.filter(o=>(o.status||'pending')===s);
      if(!items.length) continue;
      html+=`<div class="gh ${s}"><span class="dot"></span><span class="ttl">${esc(LABELS[s])}</span><span class="n">${items.length}</span></div>`;
      html+=`<div class="olist">${items.map(objRow).join('')}</div>`;
    }
  }
  list.innerHTML=html;
  for(const box of list.querySelectorAll('.chk')) box.addEventListener('change',onToggle);
}

async function onToggle(ev){
  const box=ev.currentTarget, card=box.closest('.obj');
  const id=parseInt(card.dataset.id,10), was=card.dataset.status||'pending';
  const next=box.checked?'done':'pending';
  box.disabled=true;
  try{
    const r=await fetch(`/api/objectives/${id}`,{method:'POST',
      headers:{'Content-Type':'application/json','X-Requested-With':'pen-agent-portal'},
      body:JSON.stringify({status:next,note:`toggled from portal (${new Date().toISOString()})`})});
    if(!r.ok){const err=await r.json().catch(()=>({error:'request failed'}));box.checked=(was==='done');setConn(false,`write failed: ${err.error||r.statusText}`);}
    else{await load();}
  }catch(e){box.checked=(was==='done');setConn(false,`write failed: ${e}`);}
  finally{box.disabled=false;}
}

function load(){
  return fetch('/api/objectives').then(r=>r.json())
    .then(d=>{dataCache=d;renderHero(d);renderFilters(d);renderList(d);setConn(true,'live');})
    .catch(()=>setConn(false,'disconnected'));
}
load();
setInterval(load,5000);
</script>
</body></html>
