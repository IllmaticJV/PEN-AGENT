<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>PEN-AGENT &middot; Objective Tracker</title>
<style>
:root{
  --bg:#0a0c10;--surface:#11151b;--surface-2:#161b22;--surface-3:#1c222b;
  --border:#222935;--border-strong:#2f3744;
  --fg:#e6edf3;--fg-muted:#9aa5b1;--fg-dim:#6b7682;
  --accent:#4f8cff;--accent-2:#7aa7ff;--accent-glow:rgba(79,140,255,.16);
  --green:#3fb950;--red:#f85149;--amber:#d6a533;--purple:#a371f7;
  --ui:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,"SF Mono","Cascadia Code","JetBrains Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--ui);
     height:100vh;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
header{padding:8px 18px;min-height:50px;border-bottom:1px solid var(--border);display:flex;
       align-items:center;gap:10px 14px;flex-shrink:0;flex-wrap:wrap;
       background:linear-gradient(180deg,var(--surface-2),var(--surface))}
header h1{font-size:13px;margin:0;color:var(--fg);font-weight:600;letter-spacing:.03em}
header h1 .k{color:var(--accent)}
#status{font-size:11px;font-weight:600;letter-spacing:.03em;padding:3px 10px;border-radius:999px;
        border:1px solid var(--border-strong);color:var(--fg-dim);display:inline-flex;align-items:center;gap:6px}
#status::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--fg-dim)}
#status.ok{color:var(--green);border-color:rgba(63,185,80,.5);background:rgba(63,185,80,.08)}
#status.ok::before{background:var(--green);box-shadow:0 0 6px var(--green)}
#status.bad{color:var(--red);border-color:rgba(248,81,73,.5);background:rgba(248,81,73,.08)}
#status.bad::before{background:var(--red);box-shadow:0 0 6px var(--red)}
.attach{font-size:11px;color:var(--fg-dim);font-family:var(--ui)}
.attach code{color:var(--amber);font-family:var(--mono);background:var(--surface-3);
       border:1px solid var(--border);border-radius:5px;padding:2px 6px;margin-left:4px}
main{flex:1;overflow-y:auto;padding:18px 20px 32px;max-width:1300px;width:100%;margin:0 auto}
h2{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--fg-dim);font-weight:600;
   margin:22px 0 10px;display:flex;align-items:center;gap:7px}
h2::before{content:"";width:3px;height:11px;background:var(--accent);border-radius:2px;
   box-shadow:0 0 8px var(--accent-glow)}
h2 .count{color:var(--fg-dim);font-size:10px;font-weight:500;text-transform:none;letter-spacing:0;font-family:var(--mono)}

.summary{background:linear-gradient(180deg,var(--surface-2),var(--surface));
   border:1px solid var(--border);border-radius:12px;padding:16px 18px;
   box-shadow:0 1px 2px rgba(0,0,0,.35);position:relative;overflow:hidden}
.summary::before{content:"";position:absolute;top:0;left:0;right:0;height:2px;
   background:linear-gradient(90deg,var(--accent),transparent);opacity:.7}
.summary .row{display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap}
.pct{font-family:var(--mono);font-size:26px;font-weight:700;color:var(--fg);line-height:1;
   font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.pct small{display:block;font-size:10px;font-weight:600;color:var(--fg-dim);letter-spacing:.08em;
   text-transform:uppercase;margin-top:4px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;
   padding:3px 9px;border-radius:999px;background:var(--surface-3);
   border:1px solid var(--border-strong);color:var(--fg-muted);font-family:var(--mono)}
.chip .n{font-variant-numeric:tabular-nums}
.chip.done{color:var(--green);border-color:rgba(63,185,80,.5);background:rgba(63,185,80,.1)}
.chip.in_progress{color:var(--accent);border-color:rgba(79,140,255,.5);background:rgba(79,140,255,.1)}
.chip.blocked{color:var(--red);border-color:rgba(248,81,73,.5);background:rgba(248,81,73,.1)}
.chip.skipped{color:var(--purple);border-color:rgba(163,113,247,.5);background:rgba(163,113,247,.1)}
.chip.pending{color:var(--fg-muted)}
.bar{margin-top:12px;height:7px;background:var(--surface-3);border:1px solid var(--border);
   border-radius:5px;overflow:hidden;display:flex}
.bar span{display:block;height:100%}
.bar .done{background:var(--green)}
.bar .in_progress{background:var(--accent)}
.bar .blocked{background:var(--red)}
.bar .skipped{background:var(--purple)}
.synchint{margin-top:10px;font-size:10.5px;color:var(--amber);font-family:var(--mono)}

.list{display:flex;flex-direction:column;gap:8px}
.item{display:grid;grid-template-columns:36px 1fr auto;gap:12px;align-items:start;
   background:linear-gradient(180deg,var(--surface-2),var(--surface));
   border:1px solid var(--border);border-radius:10px;padding:12px 14px;
   box-shadow:0 1px 2px rgba(0,0,0,.35);transition:border-color .12s}
.item:hover{border-color:var(--border-strong)}
.item.done{border-left:3px solid var(--green)}
.item.in_progress{border-left:3px solid var(--accent)}
.item.blocked{border-left:3px solid var(--red)}
.item.skipped{border-left:3px solid var(--purple)}
.item.pending{border-left:3px solid var(--border-strong)}
.idx{font-family:var(--mono);font-size:14px;font-weight:700;color:var(--fg-muted);
   padding-top:1px;text-align:center;font-variant-numeric:tabular-nums}
.body{min-width:0}
.text{font-size:13px;color:var(--fg);line-height:1.5;word-wrap:break-word;overflow-wrap:anywhere}
.item.done .text{color:var(--fg-muted);text-decoration:line-through;text-decoration-color:rgba(63,185,80,.5)}
.item.skipped .text{color:var(--fg-dim)}
.note{margin-top:5px;font-size:11.5px;color:var(--fg-muted);font-family:var(--mono);
   padding:5px 9px;background:var(--surface-3);border-radius:5px;
   border-left:2px solid var(--border-strong);word-wrap:break-word;overflow-wrap:anywhere}
.right{display:flex;flex-direction:column;align-items:flex-end;gap:5px;min-width:90px}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:700;
   padding:3px 9px;border-radius:5px;font-family:var(--mono);letter-spacing:.03em;
   text-transform:uppercase;white-space:nowrap}
.badge.done{color:var(--green);background:rgba(63,185,80,.14);border:1px solid rgba(63,185,80,.4)}
.badge.in_progress{color:var(--accent);background:rgba(79,140,255,.14);border:1px solid rgba(79,140,255,.4)}
.badge.blocked{color:var(--red);background:rgba(248,81,73,.14);border:1px solid rgba(248,81,73,.4)}
.badge.skipped{color:var(--purple);background:rgba(163,113,247,.14);border:1px solid rgba(163,113,247,.4)}
.badge.pending{color:var(--fg-dim);background:var(--surface-3);border:1px solid var(--border)}
.ts{font-size:9.5px;color:var(--fg-dim);font-family:var(--mono)}
.unsynced{font-size:9.5px;color:var(--amber);font-family:var(--mono);letter-spacing:.03em;
   text-transform:uppercase;font-weight:600}

.empty{color:var(--fg-dim);font-size:12.5px;font-family:var(--mono);padding:14px 0}
.help{margin-top:16px;font-size:10.5px;color:var(--fg-dim);font-family:var(--mono);line-height:1.6}
.help code{background:var(--surface-3);border:1px solid var(--border);border-radius:4px;
   padding:1px 5px;color:var(--fg-muted)}

@media (max-width:620px){
  main{padding:14px 14px 28px}
  .summary{padding:13px 14px}
  .item{grid-template-columns:28px 1fr;gap:10px;padding:11px 12px}
  .right{grid-column:2;flex-direction:row;align-items:center;align-self:flex-start;gap:7px}
  .idx{font-size:13px}
  .attach{display:none}
}
</style></head>
<body>
<header>
  <h1><span class="k">GOALS</span> &middot; Objective Tracker</h1>
  <span id="status">loading&hellip;</span>
  <span style="flex:1"></span>
  <span class="attach">lead marks progress via
    <code>mcp__state__update_objective</code></span>
</header>
<main>
  <div class="summary">
    <div class="row">
      <div class="pct"><span id="pct">—</span>%<small>complete</small></div>
      <div class="chips" id="chips"></div>
    </div>
    <div class="bar" id="bar"></div>
    <div class="synchint" id="synchint" style="display:none"></div>
  </div>

  <h2>Objectives <span id="count" class="count"></span></h2>
  <div class="list" id="list"></div>

  <div class="help">
    Statuses: <code>pending</code> · <code>in_progress</code> · <code>done</code> ·
    <code>blocked</code> · <code>skipped</code>. The list is re-parsed from
    <code>engagement/scope.md</code>; status + note persist in
    <code>engagement/objectives.json</code>.
  </div>
</main>

<script>
const STATUSES = ["done","in_progress","blocked","skipped","pending"];
const statusEl = document.getElementById('status');
function esc(s){return (s??'').toString().replace(/&/g,'&amp;').replace(/</g,'&lt;');}
function setStatus(ok, msg){ statusEl.textContent = msg; statusEl.className = ok ? 'ok' : 'bad'; }
function render(d){
  const total = d.total || 0;
  document.getElementById('pct').textContent = total ? d.percent : 0;

  const chips = document.getElementById('chips');
  const parts = [`<span class="chip"><span class="n">${total}</span>&nbsp;total</span>`];
  for (const s of STATUSES) {
    const n = (d.counts && d.counts[s]) || 0;
    if (n > 0) parts.push(`<span class="chip ${s}"><span class="n">${n}</span>&nbsp;${s.replace('_',' ')}</span>`);
  }
  chips.innerHTML = parts.join('');

  const bar = document.getElementById('bar');
  if (total > 0) {
    const seg = (s) => {
      const n = (d.counts && d.counts[s]) || 0;
      if (!n) return '';
      const w = (100 * n / total).toFixed(2);
      return `<span class="${s}" style="width:${w}%" title="${s}: ${n}"></span>`;
    };
    bar.innerHTML = seg('done') + seg('in_progress') + seg('blocked') + seg('skipped');
    bar.style.display = 'flex';
  } else {
    bar.style.display = 'none';
  }

  const hint = document.getElementById('synchint');
  if (d.unsynced) {
    hint.style.display = 'block';
    hint.textContent = '⚠ scope.md has objectives not yet synced to objectives.json. Lead: run mcp__state__init_objectives to re-parse.';
  } else {
    hint.style.display = 'none';
  }

  document.getElementById('count').textContent = total ? `(${total} total)` : '';

  const list = document.getElementById('list');
  if (!total) {
    list.innerHTML = '<div class="empty">No objectives parsed yet. Add an OBJECTIVES: block to engagement/scope.md and have the lead run <code style="font-family:inherit">mcp__state__init_objectives</code>.</div>';
    return;
  }
  list.innerHTML = d.objectives.map(o => {
    const s = o.status || 'pending';
    const ts = o.updated_at ? ` <span class="ts">${esc(o.updated_at)}</span>` : '';
    const unsynced = o.unsynced ? ` <span class="unsynced">unsynced</span>` : '';
    const note = o.note ? `<div class="note">${esc(o.note)}</div>` : '';
    return `<div class="item ${s}">
      <div class="idx">${esc(o.id)}</div>
      <div class="body"><div class="text">${esc(o.text)}</div>${note}</div>
      <div class="right"><span class="badge ${s}">${esc(s.replace('_',' '))}</span>${ts}${unsynced}</div>
    </div>`;
  }).join('');
}
function load(){
  fetch('/api/objectives')
    .then(r=>r.json())
    .then(d=>{ render(d); setStatus(true, 'live'); })
    .catch(()=>setStatus(false, 'disconnected'));
}
load();
setInterval(load, 5000);
</script>
</body></html>
