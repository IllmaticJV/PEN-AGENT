<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>PEN-AGENT &middot; Objective Tracker</title>
<style>
:root{
  --bg:#0a0c10;--bg2:#11151b;--bg3:#1c222b;
  --surface-2:#161b22;--border:#222935;--border-strong:#2f3744;
  --fg:#e6edf3;--fg-muted:#9aa5b1;--fg-dim:#6b7682;
  --accent:#4f8cff;--accent-2:#7aa7ff;--accent-glow:rgba(79,140,255,.16);
  --green:#3fb950;--red:#f85149;--amber:#d6a533;--orange:#d6a533;--purple:#a371f7;
  --ui:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,"SF Mono","Cascadia Code","JetBrains Mono",Menlo,Consolas,monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--ui);font-size:13px;
     -webkit-font-smoothing:antialiased;height:100vh;display:flex;flex-direction:column}
header.chrome{padding:8px 18px;min-height:50px;border-bottom:1px solid var(--border);
     display:flex;align-items:center;gap:10px 14px;flex-shrink:0;flex-wrap:wrap;
     background:linear-gradient(180deg,var(--surface-2),var(--bg2))}
header.chrome h1{font-size:13px;margin:0;color:var(--fg);font-weight:600;letter-spacing:.03em}
header.chrome h1 .k{color:var(--accent)}
#status{font-size:11px;font-weight:600;letter-spacing:.03em;padding:3px 10px;border-radius:999px;
     border:1px solid var(--border-strong);color:var(--fg-dim);display:inline-flex;align-items:center;gap:6px}
#status::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--fg-dim)}
#status.ok{color:var(--green);border-color:rgba(63,185,80,.5);background:rgba(63,185,80,.08)}
#status.ok::before{background:var(--green);box-shadow:0 0 6px var(--green)}
#status.bad{color:var(--red);border-color:rgba(248,81,73,.5);background:rgba(248,81,73,.08)}
#status.bad::before{background:var(--red);box-shadow:0 0 6px var(--red)}
.attach{font-size:11px;color:var(--fg-dim);font-family:var(--ui)}
.attach code{color:var(--orange);font-family:var(--mono);background:var(--bg3);
     border:1px solid var(--border);border-radius:5px;padding:2px 6px;margin-left:4px}

main{flex:1;overflow-y:auto;padding:20px 24px 40px;max-width:1400px;width:100%;margin:0 auto}

h2{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--fg-dim);
   margin:26px 0 12px;display:flex;align-items:center;gap:8px}
h2::before{content:"";width:3px;height:13px;background:var(--accent);border-radius:2px;
   box-shadow:0 0 8px var(--accent-glow)}
h2 .n{color:var(--fg-dim);font-weight:500;letter-spacing:0;text-transform:none;font-family:var(--mono);margin-left:auto;font-size:11px}

/* Progress hero: percent + bar + stat cards side by side */
.hero{display:grid;grid-template-columns:minmax(220px,280px) 1fr;gap:14px;align-items:stretch}
.hero-pct{background:linear-gradient(180deg,var(--surface-2),var(--bg2));
   border:1px solid var(--border);border-radius:12px;padding:18px 20px;position:relative;overflow:hidden;
   box-shadow:0 1px 2px rgba(0,0,0,.35);display:flex;flex-direction:column;justify-content:center}
.hero-pct::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;
   background:linear-gradient(90deg,var(--accent),transparent);opacity:.9}
.hero-pct .big{font-size:48px;font-weight:800;font-family:var(--mono);line-height:1;
   font-variant-numeric:tabular-nums;color:var(--fg);letter-spacing:-.02em}
.hero-pct .big .u{font-size:22px;color:var(--fg-dim);font-weight:600;margin-left:4px}
.hero-pct .sub{color:var(--fg-dim);font-size:10.5px;font-weight:600;letter-spacing:.08em;
   text-transform:uppercase;margin-top:8px}
.hero-pct .bar{margin-top:14px;height:8px;background:var(--bg3);border:1px solid var(--border);
   border-radius:5px;overflow:hidden;display:flex}
.hero-pct .bar span{display:block;height:100%}
.hero-pct .bar .done{background:var(--green)}
.hero-pct .bar .in_progress{background:var(--accent)}
.hero-pct .bar .blocked{background:var(--red)}
.hero-pct .bar .skipped{background:var(--purple)}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.stat{background:linear-gradient(180deg,var(--surface-2),var(--bg2));
   border:1px solid var(--border);border-radius:12px;padding:12px 14px;position:relative;overflow:hidden;
   box-shadow:0 1px 2px rgba(0,0,0,.35)}
.stat::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;
   background:linear-gradient(90deg,var(--accent),transparent);opacity:.5}
.stat.done::before{background:linear-gradient(90deg,var(--green),transparent);opacity:.9}
.stat.in_progress::before{background:linear-gradient(90deg,var(--accent),transparent);opacity:.9}
.stat.blocked::before{background:linear-gradient(90deg,var(--red),transparent);opacity:.9}
.stat.skipped::before{background:linear-gradient(90deg,var(--purple),transparent);opacity:.9}
.stat.pending::before{background:linear-gradient(90deg,var(--fg-dim),transparent);opacity:.6}
.stat .n{font-size:22px;font-weight:700;font-family:var(--mono);line-height:1.1;
   font-variant-numeric:tabular-nums;letter-spacing:-.01em;color:var(--fg)}
.stat.done .n{color:var(--green)}
.stat.in_progress .n{color:var(--accent)}
.stat.blocked .n{color:var(--red)}
.stat.skipped .n{color:var(--purple)}
.stat .label{color:var(--fg-dim);font-size:10px;font-weight:600;letter-spacing:.08em;
   text-transform:uppercase;margin-top:3px}

.synchint{margin-top:14px;padding:9px 12px;background:rgba(214,165,51,.08);
   border:1px solid rgba(214,165,51,.3);border-radius:8px;font-size:11.5px;
   color:var(--amber);font-family:var(--mono);line-height:1.4}

/* Objective cards grid */
.obj-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:12px}
.obj{background:linear-gradient(180deg,var(--surface-2),var(--bg2));
   border:1px solid var(--border);border-radius:12px;padding:14px 16px;
   box-shadow:0 1px 2px rgba(0,0,0,.35);display:flex;flex-direction:column;gap:10px;
   position:relative;overflow:hidden;transition:border-color .12s,transform .12s}
.obj:hover{border-color:var(--border-strong)}
.obj::before{content:'';position:absolute;top:0;left:0;bottom:0;width:3px;background:var(--border-strong)}
.obj.done::before{background:var(--green);box-shadow:0 0 10px rgba(63,185,80,.4)}
.obj.in_progress::before{background:var(--accent);box-shadow:0 0 10px var(--accent-glow)}
.obj.blocked::before{background:var(--red);box-shadow:0 0 10px rgba(248,81,73,.4)}
.obj.skipped::before{background:var(--purple)}
.obj-head{display:flex;align-items:center;gap:10px}
.obj-id{font-family:var(--mono);font-size:14px;font-weight:700;color:var(--accent);
   padding:3px 9px;border-radius:6px;background:var(--accent-glow);
   border:1px solid rgba(79,140,255,.3);font-variant-numeric:tabular-nums;line-height:1}
.obj.done .obj-id{color:var(--green);background:rgba(63,185,80,.1);border-color:rgba(63,185,80,.3)}
.obj.blocked .obj-id{color:var(--red);background:rgba(248,81,73,.1);border-color:rgba(248,81,73,.3)}
.obj.skipped .obj-id{color:var(--purple);background:rgba(163,113,247,.1);border-color:rgba(163,113,247,.3)}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:700;
   padding:3px 9px;border-radius:5px;font-family:var(--mono);letter-spacing:.04em;
   text-transform:uppercase;white-space:nowrap;margin-left:auto}
.badge.done{color:var(--green);background:rgba(63,185,80,.14);border:1px solid rgba(63,185,80,.4)}
.badge.in_progress{color:var(--accent);background:rgba(79,140,255,.14);border:1px solid rgba(79,140,255,.4)}
.badge.blocked{color:var(--red);background:rgba(248,81,73,.14);border:1px solid rgba(248,81,73,.4)}
.badge.skipped{color:var(--purple);background:rgba(163,113,247,.14);border:1px solid rgba(163,113,247,.4)}
.badge.pending{color:var(--fg-dim);background:var(--bg3);border:1px solid var(--border)}
.obj-text{font-size:13.5px;color:var(--fg);line-height:1.5;word-wrap:break-word;overflow-wrap:anywhere}
.obj.done .obj-text{color:var(--fg-muted)}
.obj.skipped .obj-text{color:var(--fg-dim)}
.obj-note{padding:8px 11px;background:var(--bg3);border-radius:6px;border-left:2px solid var(--border-strong);
   font-family:var(--mono);font-size:11.5px;color:var(--fg-muted);line-height:1.45;
   word-wrap:break-word;overflow-wrap:anywhere}
.obj-note .k{font-size:9px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
   color:var(--fg-dim);display:block;margin-bottom:4px}
.obj-foot{display:flex;align-items:center;gap:10px;font-size:10px;color:var(--fg-dim);
   font-family:var(--mono);margin-top:auto;padding-top:4px}
.obj-foot .unsync{color:var(--amber);font-weight:700;letter-spacing:.04em;text-transform:uppercase}

/* Status filter chips */
.filters{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px;margin-bottom:12px}
.f-chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;
   padding:4px 10px;border-radius:999px;background:var(--bg3);
   border:1px solid var(--border-strong);color:var(--fg-muted);font-family:var(--mono);
   cursor:pointer;transition:color .1s,border-color .1s,background .1s}
.f-chip:hover{color:var(--fg)}
.f-chip.active{color:var(--fg);background:var(--accent-glow);border-color:var(--accent)}
.f-chip .n{font-variant-numeric:tabular-nums;color:var(--fg-dim)}
.f-chip.active .n{color:var(--accent-2)}

.empty-card{background:linear-gradient(180deg,var(--surface-2),var(--bg2));
   border:1px solid var(--border);border-radius:12px;padding:28px 20px;text-align:center;
   color:var(--fg-dim);font-size:12.5px;font-family:var(--mono)}
.empty-card code{color:var(--orange);background:var(--bg3);border:1px solid var(--border);
   border-radius:4px;padding:1px 5px}

@media (max-width:760px){
  main{padding:14px 14px 28px}
  .attach{display:none}
  .hero{grid-template-columns:1fr}
  .hero-pct .big{font-size:38px}
  .obj-grid{grid-template-columns:1fr}
}
</style></head>
<body>
<header class="chrome">
  <h1><span class="k">GOALS</span> &middot; Objective Tracker</h1>
  <span id="status">loading&hellip;</span>
  <span style="flex:1"></span>
  <span class="attach">lead marks progress via <code>mcp__state__update_objective</code></span>
</header>
<main>
  <h2>Progress</h2>
  <div class="hero">
    <div class="hero-pct">
      <div class="big"><span id="pct">0</span><span class="u">%</span></div>
      <div class="sub" id="pct-sub">complete</div>
      <div class="bar" id="bar"></div>
    </div>
    <div class="stat-grid" id="stats"></div>
  </div>
  <div class="synchint" id="synchint" style="display:none"></div>

  <h2>Objectives <span class="n" id="count"></span></h2>
  <div class="filters" id="filters"></div>
  <div id="list"></div>
</main>

<script>
const STATUSES = ["done","in_progress","blocked","skipped","pending"];
const LABELS = {done:"Done", in_progress:"In progress", blocked:"Blocked", skipped:"Skipped", pending:"Pending"};
const statusEl = document.getElementById('status');
let dataCache = null;
let filter = 'all';
try { filter = localStorage.getItem('goals-filter') || 'all'; } catch(e){}

function esc(s){return (s??'').toString().replace(/&/g,'&amp;').replace(/</g,'&lt;');}
function setStatus(ok, msg){ statusEl.textContent = msg; statusEl.className = ok ? 'ok' : 'bad'; }

function renderHero(d){
  const total = d.total || 0;
  document.getElementById('pct').textContent = total ? d.percent : 0;
  document.getElementById('pct-sub').textContent = total
    ? `complete · ${d.completed} / ${total} objectives`
    : 'complete';

  const bar = document.getElementById('bar');
  if (total > 0) {
    const seg = s => {
      const n = (d.counts && d.counts[s]) || 0;
      if (!n) return '';
      return `<span class="${s}" style="width:${(100*n/total).toFixed(2)}%" title="${s}: ${n}"></span>`;
    };
    bar.innerHTML = seg('done') + seg('in_progress') + seg('blocked') + seg('skipped');
  } else bar.innerHTML = '';

  const stats = document.getElementById('stats');
  stats.innerHTML = STATUSES.map(s => {
    const n = (d.counts && d.counts[s]) || 0;
    return `<div class="stat ${s}"><div class="n">${n}</div><div class="label">${esc(LABELS[s])}</div></div>`;
  }).join('');

  const hint = document.getElementById('synchint');
  if (d.unsynced) {
    hint.style.display = 'block';
    hint.textContent = '⚠ scope.md has objectives not yet in objectives.json. Lead: run mcp__state__init_objectives to re-parse.';
  } else hint.style.display = 'none';
}

function renderFilters(d){
  const total = d.total || 0;
  const items = [{k:'all', n: total}].concat(
    STATUSES.map(s => ({k:s, n:(d.counts && d.counts[s]) || 0}))
  );
  const bar = document.getElementById('filters');
  bar.innerHTML = items.map(i => {
    const label = i.k === 'all' ? 'All' : LABELS[i.k];
    const active = i.k === filter ? ' active' : '';
    return `<span class="f-chip${active}" data-k="${i.k}">${esc(label)}&nbsp;<span class="n">${i.n}</span></span>`;
  }).join('');
  for (const c of bar.querySelectorAll('.f-chip')) {
    c.onclick = () => {
      filter = c.dataset.k;
      try { localStorage.setItem('goals-filter', filter); } catch(e){}
      renderFilters(dataCache);
      renderList(dataCache);
    };
  }
}

function renderList(d){
  const list = document.getElementById('list');
  const total = d.total || 0;
  document.getElementById('count').textContent = total ? `(${total})` : '';
  if (!total) {
    list.innerHTML = '<div class="empty-card">No objectives parsed yet. Add an OBJECTIVES: block to <code>engagement/scope.md</code> and have the lead run <code>mcp__state__init_objectives</code>.</div>';
    return;
  }
  const items = (filter === 'all')
    ? d.objectives
    : d.objectives.filter(o => (o.status || 'pending') === filter);
  if (!items.length) {
    list.innerHTML = `<div class="empty-card">No objectives in <b style="color:var(--fg-muted)">${esc(LABELS[filter] || filter)}</b> yet.</div>`;
    return;
  }
  list.innerHTML = '<div class="obj-grid">' + items.map(o => {
    const s = o.status || 'pending';
    const note = o.note ? `<div class="obj-note"><span class="k">operator note</span>${esc(o.note)}</div>` : '';
    const ts = o.updated_at ? `updated ${esc(o.updated_at)}` : 'never updated';
    const unsync = o.unsynced ? ` · <span class="unsync">unsynced</span>` : '';
    return `<div class="obj ${s}">
      <div class="obj-head">
        <span class="obj-id">#${esc(o.id)}</span>
        <span class="badge ${s}">${esc(s.replace('_',' '))}</span>
      </div>
      <div class="obj-text">${esc(o.text)}</div>
      ${note}
      <div class="obj-foot">${ts}${unsync}</div>
    </div>`;
  }).join('') + '</div>';
}

function load(){
  fetch('/api/objectives')
    .then(r=>r.json())
    .then(d=>{
      dataCache = d;
      renderHero(d);
      renderFilters(d);
      renderList(d);
      setStatus(true, 'live');
    })
    .catch(()=>setStatus(false, 'disconnected'));
}
load();
setInterval(load, 5000);
</script>
</body></html>
