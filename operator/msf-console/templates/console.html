<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>PEN-AGENT &middot; msf-console</title>
<style>
:root{--bg:#0b0d10;--panel:#14181d;--border:#2a2f37;--fg:#c9d1d9;--dim:#6e7681;
      --accent:#8ab4f8;--green:#3fb950;--red:#f85149;--amber:#d29922}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:ui-monospace,Menlo,Consolas,monospace;
     height:100vh;display:flex;flex-direction:column}
header{padding:10px 16px;border-bottom:1px solid var(--border);display:flex;
       align-items:center;gap:14px;flex-shrink:0}
header h1{font-size:14px;margin:0;color:var(--accent);font-weight:600}
#status{font-size:12px;padding:2px 8px;border-radius:10px;border:1px solid var(--border)}
#status.ok{color:var(--green);border-color:var(--green)}
#status.bad{color:var(--red);border-color:var(--red)}
.attach{font-size:12px;color:var(--dim)}
.attach code{color:var(--amber)}
main{flex:1;display:flex;min-height:0}
#side{width:340px;border-right:1px solid var(--border);overflow-y:auto;flex-shrink:0}
section{padding:10px 14px;border-bottom:1px solid var(--border)}
section h2{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);margin:0 0 8px}
table{width:100%;border-collapse:collapse;font-size:12px}
td{padding:3px 4px;border-bottom:1px solid #1c2127;vertical-align:top}
td.id{color:var(--accent);cursor:pointer;white-space:nowrap}
td.id:hover{text-decoration:underline}
tr.sel td.id{color:var(--amber);font-weight:600}
.empty{color:var(--dim);font-size:12px;padding:4px}
#logwrap{flex:1;display:flex;flex-direction:column;min-width:0}
#loghead{padding:8px 14px;border-bottom:1px solid var(--border);font-size:12px;color:var(--dim);
         display:flex;align-items:center;gap:10px;flex-shrink:0}
#logtitle{color:var(--fg)}
#log{flex:1;overflow-y:auto;padding:12px 14px;white-space:pre-wrap;word-break:break-all;
     font-size:13px;line-height:1.45}
.rec{margin:0 0 14px}
.rec .cmd{color:var(--green)}
.rec .cmd::before{content:"$ ";color:var(--dim)}
.rec .ts{color:var(--dim);font-size:11px;margin-left:8px}
.rec .out{color:var(--fg);margin-top:2px}
.pill{font-size:11px;padding:2px 8px;border:1px solid var(--border);border-radius:10px;
      cursor:pointer;color:var(--dim)}
.pill:hover{color:var(--fg)}
.pill.active{color:var(--accent);border-color:var(--accent)}
</style></head>
<body>
<header>
  <h1>msf-console</h1>
  <span id="status">connecting&hellip;</span>
  <span style="flex:1"></span>
  <span class="attach">read-only viewer &middot; interact in the real console:
    <code>tmux attach -t pen-msf</code></span>
</header>
<main>
  <div id="side">
    <section>
      <h2>Sessions</h2>
      <table id="sessions"><tbody></tbody></table>
      <div class="empty" id="sessions-empty">none yet</div>
    </section>
    <section>
      <h2>Listeners / Jobs</h2>
      <table id="jobs"><tbody></tbody></table>
      <div class="empty" id="jobs-empty">none yet</div>
    </section>
  </div>
  <div id="logwrap">
    <div id="loghead">
      <span id="logtitle">Select a session to view its command log</span>
      <span style="flex:1"></span>
      <span class="pill" id="pill-console" onclick="showConsole()">console spool</span>
    </div>
    <div id="log"></div>
  </div>
</main>
<script>
const statusEl = document.getElementById('status');
const logEl = document.getElementById('log');
const logTitle = document.getElementById('logtitle');
let selectedSid = null;   // viewing a session log
let viewConsole = false;  // viewing the console spool instead
let sessionsCache = [];

function setStatus(connected, msg) {
  statusEl.textContent = msg || (connected ? 'connected' : 'disconnected');
  statusEl.className = connected ? 'ok' : 'bad';
}

function esc(s) { return (s ?? '').toString().replace(/&/g,'&amp;').replace(/</g,'&lt;'); }

function renderTable(id, emptyId, rows, cols, onClick) {
  const tbody = document.querySelector('#' + id + ' tbody');
  tbody.innerHTML = '';
  document.getElementById(emptyId).style.display = rows.length ? 'none' : 'block';
  for (const row of rows) {
    const tr = document.createElement('tr');
    if (id === 'sessions' && String(row.session_id) === String(selectedSid)) tr.className = 'sel';
    tr.innerHTML = cols.map((c, i) =>
      `<td class="${i === 0 ? 'id' : ''}">${esc(row[c])}</td>`).join('');
    if (onClick) tr.querySelector('td.id').onclick = () => onClick(row);
    tbody.appendChild(tr);
  }
}

function selectSession(sid) {
  selectedSid = String(sid);
  viewConsole = false;
  document.getElementById('pill-console').classList.remove('active');
  logTitle.textContent = 'session ' + selectedSid + ' — command log';
  renderTable('sessions', 'sessions-empty', sessionsCache,
    ['session_id', 'type', 'info'], r => selectSession(r.session_id));
  refreshLog();
}

function showConsole() {
  viewConsole = true;
  selectedSid = null;
  document.getElementById('pill-console').classList.add('active');
  logTitle.textContent = 'shared msfconsole spool';
  renderTable('sessions', 'sessions-empty', sessionsCache,
    ['session_id', 'type', 'info'], r => selectSession(r.session_id));
  refreshLog();
}

function refreshLog() {
  if (viewConsole) {
    fetch('/api/console/log').then(r => r.json()).then(j => {
      logEl.textContent = j.data || (j.error ? '[error] ' + j.error : '(console spool empty — enable spool in tmux, or no activity yet)');
      logEl.scrollTop = logEl.scrollHeight;
    });
    return;
  }
  if (selectedSid === null) return;
  fetch('/api/session/log?id=' + encodeURIComponent(selectedSid)).then(r => r.json()).then(j => {
    const recs = j.records || [];
    if (!recs.length) { logEl.innerHTML = '<div class="empty">no commands recorded for this session yet</div>'; return; }
    logEl.innerHTML = recs.map(r =>
      `<div class="rec"><div class="cmd">${esc(r.command)}<span class="ts">${esc(r.ts)}</span></div>`
      + `<div class="out">${esc(r.output)}</div></div>`).join('');
    logEl.scrollTop = logEl.scrollHeight;
  }).catch(e => { logEl.textContent = '[error] ' + e; });
}

setInterval(refreshLog, 2000);

const es = new EventSource('/api/stream');
es.onmessage = (ev) => {
  const msg = JSON.parse(ev.data);
  if (msg.type === 'sessions') {
    sessionsCache = msg.payload;
    renderTable('sessions', 'sessions-empty', msg.payload,
      ['session_id', 'type', 'info'], r => selectSession(r.session_id));
  } else if (msg.type === 'jobs') {
    renderTable('jobs', 'jobs-empty', msg.payload, ['job_id', 'name'], null);
  } else if (msg.type === 'status') {
    setStatus(msg.connected, msg.connected ? 'connected' : (msg.error || 'disconnected'));
  }
};
es.onerror = () => setStatus(false, 'stream lost — retrying');
</script>
</body></html>
