# PEN-AGENT engagement configuration
# Generated by config wizard. Edit at any time.

# Autonomy tier — governs the orchestrator's per-task operator-approval gate.
#   manual      approve every task (default; the original behaviour)
#   guided      auto-run read-only discovery (recon/enum); gate exploitation
#               and elevated actions
#   autonomous  auto-run in-scope discovery AND exploitation on already-approved
#               targets; still gate spraying (lockout), pivots/tunnels,
#               destructive actions, and opsec-high skills — CTF/lab only
# Scope is always enforced underneath: target-touching MCP servers still refuse
# anything outside scope.allow regardless of tier. Omit to default to manual.
autonomy: manual

# Model the lead retries a stuck teammate on before any operator-manual step
# (see the recovery escalation ladder). When a teammate can't get a step to
# run — a tool error, a technique that keeps failing, or a model refusal / AUP
# flag — the lead re-runs the SAME task on a fresh teammate using this model.
# Default "opus" bumps an enum(haiku)/ops(sonnet) teammate up to Opus, which
# clears model-specific refusals far more often than operator hand-holding.
# Set a specific build id (e.g. a particular Opus version) only if your
# runtime's Agent `model` accepts version ids; the plain "opus" alias resolves
# to one build. Omit to default to "opus".
# retry_model: opus

# Network scan type: quick | full
# Omit to be prompted each time.
scan_type: quick

# Web proxy for attackbox HTTP(S) traffic (Burp capture).
# Only takes effect when HTTP/HTTPS services are discovered.
# Omit entire section to be prompted when HTTP is found.
web_proxy:
  enabled: true
  url: "http://127.0.0.1:8080"

# Default password spray tier: light | medium | heavy | skip
# Hard stop still fires to show context; this pre-selects the default.
# Omit to be prompted with no default.
spray:
  default_tier: light

# Default hash cracking method: local | external | skip
# Hard stop still fires to show hash details; this pre-selects the default.
# Omit to be prompted with no default.
cracking:
  default_method: local

# Shell backend: metasploit | shell-server | custom
# metasploit: Metasploit C2 sessions via metasploit-server MCP — the DEFAULT
#             whenever metasploit-framework is installed (run.sh auto-starts
#             msfrpcd). Covers everything: session interaction, file
#             transfer, and pivoting (autoroute + SOCKS). Falls back to
#             shell-server automatically if Metasploit isn't installed or
#             msfrpcd is unreachable.
# shell-server: raw TCP listeners + PTY processes (always available — the
#               automatic fallback, or pin it explicitly to skip Metasploit)
# custom: operator-provided C2 MCP + reference doc
# Omit to default to metasploit when available, else shell-server.
shell:
  backend: metasploit
  # msf_config: "engagement/msfrpc.yaml"     # path to Metasploit RPC config (metasploit only)
  # custom_mcp: "my-c2-server"               # MCP server name (custom only)
  # custom_ref: "path/to/reference.md"        # reference doc path (custom only)

# Callback interface for reverse shells.
# Omit to auto-detect tun0/wg0 at runtime.
# callback_ip: "10.10.14.5"
# callback_interface: "tun0"
